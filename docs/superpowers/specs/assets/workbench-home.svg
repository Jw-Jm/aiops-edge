  <g transform="translate(536 588)"><rect width="276" height="112" rx="10" class="surface"/><text x="20" y="31" class="xs muted">请求错误率</text><text x="20" y="70" class="num">2.8%</text><text x="20" y="94" class="xs" fill="#c46816">异常服务贡献 81%</text></g>
