  <rect x="1178" y="356" width="352" height="54" rx="8" class="amberSoft"/><circle cx="1198" cy="383" r="5" class="orange"/><text x="1212" y="380" class="sm" font-weight="600">2 项动作待审批</text><text x="1212" y="399" class="xs muted">最高风险：中</text>
  <rect x="1178" y="422" width="352" height="54" rx="8" class="blueSoft"/><circle cx="1198" cy="449" r="5" class="blue"/><text x="1212" y="446" class="sm" font-weight="600">1 项调查需要补充证据</text><text x="1212" y="465" class="xs muted">RUN-8F2A · payment-api</text>
