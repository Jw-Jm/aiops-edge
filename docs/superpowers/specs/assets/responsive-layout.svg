<svg xmlns="http://www.w3.org/2000/svg" width="1600" height="900" viewBox="0 0 1600 900" role="img" aria-labelledby="title desc">
  <title id="title">AIOps 调查工作台响应式布局</title><desc id="desc">对比 1440、1280 和 1024 三档视口下的导航与调查栏位。</desc>
  <defs><style>
    text{font-family:Inter,"PingFang SC","Microsoft YaHei",sans-serif;fill:#172033}.muted{fill:#687386}.xs{font-size:13px}.sm{font-size:15px}.label{font-size:18px;font-weight:600}.title{font-size:34px;font-weight:700}.frame{fill:#fff;stroke:#cfd6df;stroke-width:2}.nav{fill:#f8fafc}.scope{fill:#edf2ff}.impact{fill:#f8fafc;stroke:#dfe4eb}.evidence{fill:#fff;stroke:#dfe4eb}.judgement{fill:#fff7e8;stroke:#e7d7b9}.blue{fill:#3157d5}.line{stroke:#dfe4eb}
  </style></defs>
  <rect width="1600" height="900" fill="#f4f6f9"/>
  <text x="70" y="70" class="title">调查工作台响应式规则</text><text x="70" y="102" class="sm muted">最小支持 1024px；主证据区始终保留，次要上下文逐步转为紧凑栏或 Drawer</text>
  <text x="70" y="160" class="label">≥ 1440px · 完整桌面</text><text x="1170" y="160" class="xs muted">导航 216 · 对象 264 · 判断 352</text>
  <rect x="70" y="180" width="1460" height="250" rx="14" class="frame"/><rect x="70" y="180" width="150" height="250" rx="14" class="nav"/><rect x="220" y="180" width="1310" height="42" class="scope"/><rect x="238" y="240" width="235" height="170" rx="9" class="impact"/><rect x="487" y="240" width="700" height="170" rx="9" class="evidence"/><rect x="1201" y="240" width="311" height="170" rx="9" class="judgement"/><text x="145" y="312" text-anchor="middle" class="sm muted">完整导航</text><text x="355" y="326" text-anchor="middle" class="label">对象与影响</text><text x="837" y="326" text-anchor="middle" class="label">证据时间线（主视觉）</text><text x="1356" y="314" text-anchor="middle" class="label">AI 判断</text><text x="1356" y="342" text-anchor="middle" class="sm muted">与下一步动作</text>

  <text x="70" y="492" class="label">1280–1439px · 紧凑桌面</text><text x="1120" y="492" class="xs muted">导航 64 · 对象 224 · 判断 304</text>
  <rect x="70" y="512" width="1280" height="218" rx="14" class="frame"/><rect x="70" y="512" width="64" height="218" rx="14" class="nav"/><circle cx="102" cy="552" r="13" class="blue"/><circle cx="102" cy="600" r="10" fill="none" stroke="#8793a5"/><circle cx="102" cy="648" r="10" fill="none" stroke="#8793a5"/><rect x="134" y="512" width="1216" height="38" class="scope"/><rect x="150" y="566" width="214" height="148" rx="9" class="impact"/><rect x="378" y="566" width="650" height="148" rx="9" class="evidence"/><rect x="1042" y="566" width="292" height="148" rx="9" class="judgement"/><text x="257" y="646" text-anchor="middle" class="sm">对象栏</text><text x="703" y="646" text-anchor="middle" class="label">证据时间线</text><text x="1188" y="646" text-anchor="middle" class="sm">AI 判断与动作</text>

  <text x="70" y="792" class="label">1024–1279px · 最小生产视口</text><text x="910" y="792" class="xs muted">对象移入 Drawer · 判断栏保留 304 · 禁止横向滚动</text>
  <rect x="70" y="812" width="1024" height="72" rx="14" class="frame"/><rect x="70" y="812" width="64" height="72" rx="14" class="nav"/><rect x="134" y="812" width="960" height="24" class="scope"/><rect x="150" y="848" width="82" height="24" rx="6" class="impact"/><text x="191" y="865" text-anchor="middle" class="xs">对象</text><rect x="244" y="848" width="512" height="24" rx="6" class="evidence"/><text x="500" y="865" text-anchor="middle" class="xs">证据时间线</text><rect x="768" y="848" width="310" height="24" rx="6" class="judgement"/><text x="923" y="865" text-anchor="middle" class="xs">AI 判断与动作</text><path d="M191 848 L191 820" stroke="#3157d5" stroke-width="2" stroke-dasharray="5 5"/><text x="250" y="808" class="xs" fill="#3157d5">点击打开对象 Drawer</text>
</svg>
