server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DeepFlow Grafana proxy (before SPA fallback)
    location /grafana/ {
        proxy_pass http://deepflow-grafana.deepflow.svc.cluster.local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_redirect / /grafana/;
        sub_filter 'href="/' 'href="/grafana/';
        sub_filter 'src="/' 'src="/grafana/';
        sub_filter 'action="/' 'action="/grafana/';
        sub_filter_once off;
    }
    location /grafana {
        return 301 /grafana/;
    }

    # SPA fallback: all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
    }

    # Prometheus metrics (before /api/ to avoid SPA fallback)
    location = /metrics {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    # AI Chat + MCP → ai-orchestrator (SSE streaming, must come before generic /api/)
    location /api/v1/ai/ {
        proxy_pass http://ai-orchestrator.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Ops tasks + sessions + RCA → ai-orchestrator
    location /api/v1/ops/ {
        proxy_pass http://ai-orchestrator.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # API proxy → query-api (settings, llm-providers, system, etc.)
    location /api/ {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;  # Full DAG (5 LLM calls) needs 120-300s
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Static assets: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
