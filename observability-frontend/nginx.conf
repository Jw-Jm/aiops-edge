server {
    listen 80;
    server_name _;
    root /usr/share/nginx/html;
    index index.html;

    # DeepFlow Grafana proxy (before SPA fallback). The frontend entrypoint
    # removes this marked block when the optional DeepFlow stack is disabled,
    # so nginx does not fail startup on an unresolved cross-namespace service.
    # AIOPS_DEEPFLOW_PROXY_BEGIN
    location /grafana/ {
        proxy_pass http://deepflow-grafana.deepflow.svc.cluster.local/;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 60s;
        proxy_redirect / /grafana/;
        sub_filter 'href="/' 'href="/grafana/';
        sub_filter 'src="/' 'src="/grafana/';
        sub_filter 'action="/' 'action="/grafana/';
        sub_filter_once off;
    }
    location /grafana {
        return 301 /grafana/;
    }
    # AIOPS_DEEPFLOW_PROXY_END

    # SPA entry documents must not be cached: they discover the current
    # content-hashed asset names.  Hashed files below remain immutable, so a
    # new deployment cannot leave a client running an entry that references
    # deleted chunks.
    location = / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }
    location = /index.html {
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # SPA fallback: all non-file routes go to index.html
    location / {
        try_files $uri $uri/ /index.html;
        add_header Cache-Control "no-store, no-cache, must-revalidate, proxy-revalidate" always;
    }

    # Prometheus metrics (before /api/ to avoid SPA fallback)
    location = /metrics {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_read_timeout 10s;
    }

    # AI Chat + MCP → query-api (ProxyAI 注入审批人/X-Internal-Token 后转发 ai-orchestrator)。
    # P0-2: 原先直连 ai-orchestrator 导致 suggestion/execute 等需内部鉴权的端点缺
    # X-Internal-Token → 403。统一改走 query-api 注入 token（SSE 由 query-api 透传）。
    location /api/v1/ai/ {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
        chunked_transfer_encoding on;
    }

    # Ops tasks + sessions + RCA → query-api（ProxyAI 注入审批人身份后转发到 ai-orchestrator）
    location /api/v1/ops/ {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_read_timeout 300s;
        proxy_send_timeout 300s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # API proxy → query-api (settings, llm-providers, system, etc.)
    # 含 WebShell WebSocket（/api/v1/shell/ws），需透传 Upgrade/Connection 头并关闭缓冲
    location /api/ {
        proxy_pass http://query-api.observability.svc.cluster.local:8080;
        proxy_http_version 1.1;
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
        proxy_read_timeout 3600s;  # Full DAG (5 LLM calls) needs 120-300s; WebSocket needs long read
        proxy_send_timeout 3600s;
        proxy_connect_timeout 30s;
        proxy_buffering off;
    }

    # Static assets: long cache
    location /assets/ {
        expires 1y;
        add_header Cache-Control "public, immutable";
    }
}
