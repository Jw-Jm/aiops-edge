# =============================================================================
# deepflow 独立 Helm release 配置
# deepflow 部署到独立 deepflow namespace（前端 nginx 硬编码 deepflow-grafana.deepflow）
# 用法（由 apply.sh 调用）：
#   helm install deepflow deepflow/deepflow -n deepflow -f values-deepflow.yaml
# =============================================================================

global:
  replicas: 1
  storageClass: ""
  timezone: "Asia/Shanghai"
  # 完整装：server + agent(DaemonSet) + clickhouse + mysql + grafana
  allInOneLocalStorage: true
  # 环境修复: 本机无法访问 registry.cn-hongkong.aliyuncs.com (EOF),
  # 但本地 docker 已缓存全部 deepflow 镜像 → IfNotPresent 直接用本地镜像。
  image:
    pullPolicy: IfNotPresent

# server 与各组件单副本（本机）
server:
  replicas: 1
  resources:
    requests: { cpu: "500m", memory: "1Gi" }
    limits: { cpu: "2", memory: "2Gi" }

# ---------------------------------------------------------------------------
# grafana 嵌入配置（工作流 F2）
# deepflow chart 将 grafana/grafana 作为子 chart，其 values 挂在顶层 `grafana:` 键下，
# 配置段为 `grafana.ini:`（= 常见写法 grafana.grafana.ini.<段>.<键>）。
# 目的：允许平台 iframe 嵌入，供 query-api Grafana 代理与 v3 页面使用。
# 部署在验收阶段执行（helm upgrade deepflow deepflow/deepflow -n deepflow -f 本文件）。
# ---------------------------------------------------------------------------
grafana:
  # 环境修复: grafana 子 chart values 默认 IfNotPresent, 但父 chart 默认值
  # grafana.image.pullPolicy=Always 会覆盖 → 显式设 IfNotPresent 用本地缓存镜像。
  image:
    pullPolicy: IfNotPresent
  grafana.ini:
    security:
      allow_embedding: true
      cookie_samesite: none
    auth.anonymous:
      # G5 加固：关闭匿名访问（原 enabled: true 允许匿名只读）。
      # 匿名访问会绕过 Grafana 自身的认证/审计，生产必须关闭；
      # 若 iframe 嵌入流程确实需要免登录只读，可改回 enabled: true 并保持
      # org_role: Viewer（只读，禁止 Editor/Admin），同时配合来源白名单。
      enabled: false
      org_role: Viewer

# 环境修复: deepflow-agent 子 chart 默认 pullPolicy=Always (daemonset + init 容器),
# 覆盖为 IfNotPresent 使用本地缓存镜像。
deepflow-agent:
  image:
    pullPolicy: IfNotPresent

# 环境修复: mysql/clickhouse 各自 image.pullPolicy=Always → IfNotPresent (本地缓存镜像)。
mysql:
  image:
    pullPolicy: IfNotPresent

clickhouse:
  image:
    pullPolicy: IfNotPresent

