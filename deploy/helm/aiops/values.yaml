# =============================================================================
# AIOps Helm Chart 全局 values
# 本机(arm64 OrbStack K8s)默认配置；除副本数=1 外按生产标准。
# 换环境时改 storageClass / external 地址 / 镜像即可移植。
# =============================================================================

# 全局
replicaCount: 1
# 有状态单写组件（mysql/clickhouse）副本数，固定 1（共享 RWO PVC 不可扩副本）。
statefulReplicaCount: 1
namespace:
  observability: observability
  deepflow: deepflow

# ---------------------------------------------------------------------------
# 密钥（占位，实际用 values 文件 / --set 注入，不提交真实值，不入 git）
# ---------------------------------------------------------------------------
secrets:
  # 生产必须注入强随机值（至少 32 字符/字节）。query-api 缺失 JWT_SECRET / LLM_ENCRYPTION_KEY
  # 时启动即失败（panic），杜绝弱密钥。
  jwtSecret: ""
  llmEncryptionKey: ""
  internalToken: ""
  ingestApiKey: ""
  clickhousePassword: ""
  redisPassword: ""
  # MinIO 凭证：生产必须通过 Secret/env 注入强口令，禁止使用弱默认值。
  # 留空时 MinIO 组件使用镜像默认弱口令（minioadmin/minioadmin123）——仅限本地演示，生产务必覆盖。
  minioAccessKey: ""
  minioSecretKey: ""
  mysqlRootPassword: ""

# ---------------------------------------------------------------------------
# 中间件：enabled=true 由 Chart 内部拉起；enabled=false 走 external 复用已有实例
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  external:
    host: ""
    port: "8123"
  image: "clickhouse/clickhouse-server:24.8-alpine"
  storageClass: ""
  storage: 20Gi
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }

victoriaMetrics:
  enabled: true
  external:
    host: ""
  image: "victoriametrics/victoria-metrics:v1.101.0"
  storageClass: ""
  storage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

victoriaLogs:
  enabled: true
  external:
    host: ""
  image: "victoriametrics/victoria-logs:v1.52.0"
  storageClass: ""
  storage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

# Redis：query-api 缓存为纯内存实现（原 redisGet/redisSet 为伪死代码，query-api 不依赖 Redis）。
# 但 ai-orchestrator 的 ARQ 后台任务队列（tasks.py）依赖 Redis，故保留组件。
redis:
  enabled: true
  external:
    host: ""
    port: "6379"
  image: "redis:7-alpine"
  storageClass: ""
  storage: 1Gi
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }


minio:
  enabled: true
  external:
    host: ""
    port: "9000"
  image: "minio/minio:RELEASE.2024-09-13T20-26-02Z"
  storageClass: ""
  storage: 10Gi
  resources:
    requests: { cpu: "200m", memory: "256Mi" }
    limits: { cpu: "1", memory: "1Gi" }

mysql:
  enabled: true
  external:
    host: ""
    port: "3306"
  image: "mysql:8.4"
  storageClass: ""
  storage: 10Gi
  resources:
    requests: { cpu: "200m", memory: "2Gi" }
    limits: { cpu: "1", memory: "2Gi" }

# vmalert 已关闭：告警引擎为 query-api 内置 evaluateAlerts（真引擎）。
# vmalert 原部署为空壳（无 rules volume、notifier 为空），属空转组件，关闭以省内存、消除伪双引擎。
vmalert:
  enabled: false
  image: "victoriametrics/vmalert:v1.101.0"
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

# node-exporter — 每节点采集服务器 OS 部件（CPU/内存/磁盘/网卡）
nodeExporter:
  enabled: true
  image: "prom/node-exporter:v1.8.2"

# ipmi-exporter — 每节点本地采集 IPMI 传感器（/dev/ipmi0，不走带外网）
ipmiExporter:
  enabled: true
  image: "ipmi-exporter:latest"
  imagePullPolicy: "IfNotPresent"
  collectInterval: "120"

# VM 内置 scrape（组件最小化）：抓取 node-exporter/ingest/orchestrator 指标进 VictoriaMetrics
# （query-api /metrics 为鉴权端点不作为目标）
ingestPort: 8080
orchestratorPort: 8080

# node-exporter 为 hostNetwork（hostPort 9100），需用节点 IP 抓取。
# 可移植性：必填项（填实际节点 IP），为空则不抓取 node-exporter（演示可省略）。
nodeExporterTarget: ""

# ---------------------------------------------------------------------------
# 自研服务（镜像 tag 版本化，默认 v1.0.0，与 build-images.sh 的 IMAGE_TAG 对齐。
# 升级版本时：① 改 Chart.yaml 的 appVersion ② 改此处镜像 tag ③ 重新 build-images.sh，
# 保证"代码/版本/部署"一致可追溯）
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  image: "observability-frontend:v1.1.11"
  nodePort: 30253
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

queryApi:
  enabled: true
  image: "query-api:v1.3.6"
  # ClickHouse headless service（生产多副本时指向所有 pod；不用 per-pod clickhouse-0）
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  victoriaLogsUrl: "http://victoria-logs.observability.svc.cluster.local:9428"
  victoriaMetricsUrl: "http://victoria-metrics.observability.svc.cluster.local:8428"
  # K8s 集群 API（in-cluster 自签证书环境需 skip verify）与 VictoriaLogs 采集
  k8sApiUrl: "https://kubernetes.default.svc"
  k8sInsecureSkipVerify: "true"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

ingest:
  enabled: true
  image: "ingest-pipeline:v1.0.0"
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  # DeepFlow 同步（跨 namespace；DEEPFLOW_CH_HOST 为空则禁用同步器）
  deepflowChHost: "deepflow-clickhouse.deepflow.svc.cluster.local"
  deepflowChPort: "8123"
  syncInterval: "10s"
  walStorageClass: ""
  walStorage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "2Gi" }

aiOrchestrator:
  enabled: true
  image: "ai-orchestrator:v1.1.12"
  queryApiUrl: "http://query-api.observability.svc.cluster.local:8080/api/v1"
  minioEndpoint: "minio.observability.svc.cluster.local:9000"
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  llmMock: "false"
  dataStorageClass: ""
  dataStorage: 5Gi
  resources:
    requests: { cpu: "500m", memory: "1500Mi" }
    limits: { cpu: "2", memory: "3Gi" }

# deepflow 子 chart（完整装；enabled=false 则不装）
deepflow:
  enabled: true
