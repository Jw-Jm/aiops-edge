# =============================================================================
# AIOps Helm Chart 全局 values
# 本机(arm64 OrbStack K8s)默认配置；除副本数=1 外按生产标准。
# 换环境时改 storageClass / external 地址 / 镜像即可移植。
# =============================================================================

# 全局
replicaCount: 1
# 有状态单写组件（mysql/clickhouse）副本数，固定 1（共享 RWO PVC 不可扩副本）。
statefulReplicaCount: 1
# 全局镜像 tag：自研服务镜像唯一版本来源，与 build-images.sh 的 IMAGE_TAG 及 Chart.yaml 的 appVersion 对齐。
# 升级版本时：① 改 Chart.yaml 的 appVersion ② 改此处 ③ 用 IMAGE_TAG=vX.Y.Z 重新构建镜像，保证"代码/版本/部署"一致。
global:
  imageTag: "v1.1.0"
namespace:
  observability: observability
  deepflow: deepflow

# ---------------------------------------------------------------------------
# 密钥（占位，实际用 values 文件 / --set 注入，不提交真实值，不入 git）
# ---------------------------------------------------------------------------
secrets:
  # 生产必须注入强随机值（至少 32 字符/字节）。query-api 缺失 JWT_SECRET / LLM_ENCRYPTION_KEY
  # 时启动即失败（panic），杜绝弱密钥。
  jwtSecret: ""
  llmEncryptionKey: ""
  internalToken: ""
  ingestApiKey: ""
  clickhousePassword: ""
  mysqlRootPassword: ""
  # admin 初始密码（query-api 启动种子；未设置时生成随机密码并打印一次性提示，admin 将无法用默认密码登录）
  adminInitialPassword: ""

# ---------------------------------------------------------------------------
# 中间件：enabled=true 由 Chart 内部拉起；enabled=false 走 external 复用已有实例
# ---------------------------------------------------------------------------
clickhouse:
  enabled: true
  external:
    host: ""
    port: "8123"
  image: "clickhouse/clickhouse-server:24.8-alpine"
  storageClass: ""
  storage: 20Gi
  resources:
    requests: { cpu: "500m", memory: "2Gi" }
    limits: { cpu: "2", memory: "4Gi" }

victoriaMetrics:
  enabled: true
  external:
    host: ""
  image: "victoriametrics/victoria-metrics:v1.101.0"
  storageClass: ""
  storage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

victoriaLogs:
  enabled: true
  external:
    host: ""
  image: "victoriametrics/victoria-logs:v1.52.0"
  storageClass: ""
  storage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

mysql:
  enabled: true
  external:
    host: ""
    port: "3306"
  image: "mysql:8.4"
  storageClass: ""
  storage: 10Gi
  resources:
    requests: { cpu: "200m", memory: "2Gi" }
    limits: { cpu: "1", memory: "2Gi" }

# vmalert 已关闭：告警引擎为 query-api 内置 evaluateAlerts（真引擎）。
# vmalert 原部署为空壳（无 rules volume、notifier 为空），属空转组件，关闭以省内存、消除伪双引擎。
vmalert:
  enabled: false
  image: "victoriametrics/vmalert:v1.101.0"
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }

# node-exporter — 每节点采集服务器 OS 部件（CPU/内存/磁盘/网卡）
# 已由 categraf 替代（P1-7）：categraf 内建 node_exporter 插件，职责合并，默认关闭。
# 如需单独启用可改回 true（注意与 categraf 造成重复采集）。
nodeExporter:
  enabled: false
  image: "prom/node-exporter:v1.8.2"

# ipmi-exporter — 每节点本地采集 IPMI 传感器（/dev/ipmi0，不走带外网）
# 已由 categraf 替代（P1-7）：categraf input.ipmi 插件承担 IPMI KCS 本地采集，默认关闭。
# 如需单独启用可改回 true（注意与 categraf 造成重复采集）。
ipmiExporter:
  enabled: false
  image: "ipmi-exporter:{{ .Values.global.imageTag }}"
  imagePullPolicy: "IfNotPresent"
  collectInterval: "120"

# ---------------------------------------------------------------------------
# categraf（P1-7）— 每节点主机指标采集 DaemonSet（flashcat, MIT）
# 替代 node-exporter/ipmi-exporter/自研 SNMP/中间件采集四个职责：
#   input.node_exporter → 原 node-exporter；input.ipmi → 原 ipmi-exporter；
#   input.snmp/input.mysql/input.redis 等按需增开（配置下发见平台设计 4.2）。
# 指标 remote write → VictoriaMetrics（与 scrape-config 的 node-exporter job 同目的地）。
# 默认 enabled=true；原 nodeExporter/ipmiExporter 已默认 false 避免重复采集。
# ---------------------------------------------------------------------------
categraf:
  enabled: true
  image: "flashcatcloud/categraf:v0.5.17"
  # 所属集群 ID：与 ingest.clusterId 对齐（多集群纳管时每集群一个配置/标签维度）
  clusterId: "default"
  # 全局采集间隔（秒）
  interval: 15
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "256Mi" }

# ---------------------------------------------------------------------------
# 备份（P0-9）— 每日定时把 MySQL/ClickHouse 数据导出到 backup-pvc
# 默认 enabled=true：方案要求生产必须备份；无需备份的环境可置 false，
# 或把 schedule 改为一年一次（如 "0 0 31 2 *"）实现"默认关"。
# 两个 CronJob 共用 backup-pvc（RWO），默认 02:00 / 03:00 错峰执行，无并发冲突。
# ---------------------------------------------------------------------------
backup:
  enabled: true
  storageClass: ""
  storage: 5Gi
  # 轮转：备份目录内删除超过该天数（约等于保留份数）的旧文件
  retentionDays: 7
  # MySQL 备份容器镜像（带 mysqldump 客户端即可）
  mysqlImage: "mysql:8"
  mysql:
    schedule: "0 2 * * *"   # 每日 02:00
  clickhouse:
    schedule: "0 3 * * *"   # 每日 03:00

# ---------------------------------------------------------------------------
# Ingress/TLS（P0-10）— 前端入口。默认关闭：演示环境走 NodePort(frontend.nodePort)。
# 生产启用：ingress.enabled=true + 注入证书 secret + 指定 host，详见 templates/ingress.yaml 头注释。
# ---------------------------------------------------------------------------
ingress:
  enabled: false
  host: "aiops.local"
  className: "nginx"
  # 非空才渲染 tls 段；Secret 需与 Ingress 同 namespace（observability），含 tls.crt/tls.key
  tlsSecretName: ""

# VM 内置 scrape（组件最小化）：抓取 node-exporter/ingest/orchestrator 指标进 VictoriaMetrics
# （query-api /metrics 为鉴权端点不作为目标）。
# 平台自监控：待 query-api 暴露免鉴权 /metrics 后，在 scrape-config.yaml 增加 query-api job 接入
# （需代码侧改动，超出部署侧范围，本轮不做）。
ingestPort: 8080
orchestratorPort: 8080

# node-exporter 抓取已改用 kubernetes_sd_configs（VM 自动发现 DaemonSet pod，多节点自动发现）。
# nodeExporterTarget 保留为空作为兼容占位（scrape-config 已不再引用，勿再填节点 IP）。
nodeExporterTarget: ""

# ---------------------------------------------------------------------------
# 自研服务：镜像 tag 统一引用 global.imageTag（唯一版本来源，见文件顶部），
# 与 build-images.sh 的 IMAGE_TAG 及 Chart.yaml 的 appVersion 对齐。
# 升级版本时：① 改 Chart.yaml 的 appVersion ② 改 global.imageTag ③ 用 IMAGE_TAG=vX.Y.Z 构建。
# ---------------------------------------------------------------------------
frontend:
  enabled: true
  image: "observability-frontend:{{ .Values.global.imageTag }}"
  nodePort: 30253
  resources:
    requests: { cpu: "100m", memory: "128Mi" }
    limits: { cpu: "500m", memory: "512Mi" }

queryApi:
  enabled: true
  image: "query-api:{{ .Values.global.imageTag }}"
  # ClickHouse headless service（生产多副本时指向所有 pod；不用 per-pod clickhouse-0）
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  victoriaLogsUrl: "http://victoria-logs.observability.svc.cluster.local:9428"
  victoriaMetricsUrl: "http://victoria-metrics.observability.svc.cluster.local:8428"
  # K8s 集群 API（in-cluster 自签证书环境需 skip verify）与 VictoriaLogs 采集
  k8sApiUrl: "https://kubernetes.default.svc"
  k8sInsecureSkipVerify: "true"
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "1Gi" }

ingest:
  enabled: true
  image: "ingest-pipeline:{{ .Values.global.imageTag }}"
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  # 多集群纳管：本 ingest 实例所属集群 ID（代码默认 "default"；纳管集群采集器注入各自 cluster_id）
  clusterId: "default"
  # DeepFlow 同步（跨 namespace；DEEPFLOW_CH_HOST 为空则禁用同步器）
  deepflowChHost: "deepflow-clickhouse.deepflow.svc.cluster.local"
  deepflowChPort: "8123"
  syncInterval: "10s"
  # span 抽样率（0~1）：每 flow 现在产出 client+server 两个 span，0.5 抵消写入量翻倍
  spanSampleRate: 0.5
  walStorageClass: ""
  walStorage: 5Gi
  resources:
    requests: { cpu: "200m", memory: "512Mi" }
    limits: { cpu: "1", memory: "2Gi" }

aiOrchestrator:
  enabled: true
  image: "ai-orchestrator:{{ .Values.global.imageTag }}"
  queryApiUrl: "http://query-api.observability.svc.cluster.local:8080/api/v1"
  clickhouseHost: "clickhouse.observability.svc.cluster.local"
  clickhousePort: "8123"
  llmMock: "false"
  # 知识图谱定时重建间隔（秒）；0 关闭。默认 60s（每 1 分钟刷新一次）
  kgBuildIntervalSeconds: 60
  dataStorageClass: ""
  dataStorage: 5Gi
  resources:
    requests: { cpu: "500m", memory: "1500Mi" }
    limits: { cpu: "2", memory: "3Gi" }

# deepflow 子 chart（完整装；enabled=false 则不装）
deepflow:
  enabled: true

# ---------------------------------------------------------------------------
# event-collector（P1-4）— K8s 事件 watch + IPMI SEL 明细统一落 CH。
# DaemonSet：SEL 按节点本地采集；K8s 事件为集群级资源，多副本 watch 重复由
# CH ReplacingMergeTree 去重兜底（单节点环境无影响）。
# ---------------------------------------------------------------------------
eventCollector:
  enabled: true
  image: "event-collector:{{ .Values.global.imageTag }}"
  clusterId: "default"
  k8sWatchEnabled: "true"
  selCollectEnabled: "true"
  selIntervalSeconds: 120
  clickhouseHost: "clickhouse"
  clickhousePort: 8123
  resources:
    requests: { cpu: "50m", memory: "64Mi" }
    limits: { cpu: "200m", memory: "256Mi" }
