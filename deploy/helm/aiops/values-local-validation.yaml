# Fresh Install Phase E: canonical local validation runtime.
# This profile is intentionally independent from values-prod.yaml; the caller
# supplies global.imageTag and secrets from the current Git SHA.
global:
  environment: local
internalTLS:
  # Local validation mirrors the production trust boundary with an ephemeral
  # CA/certificate generated by local-validation.sh; no certificate is stored
  # in the repository or reused outside this disposable cluster.
  enabled: true
  required: true
  secretName: aiops-internal-tls
  # The disposable local certificate carries these service identities.  A
  # production release must replace this shared list with per-service SANs.
  clientSAN: "query-api.observability.svc.cluster.local,query-run-dispatch.observability.svc.cluster.local,query-alert-eval.observability.svc.cluster.local,ai-orchestrator.observability.svc.cluster.local,ai-investigation-worker.observability.svc.cluster.local,ai-llm-egress-proxy.observability.svc.cluster.local,ingest.observability.svc.cluster.local,event-collector.observability.svc.cluster.local,ai-action-executor.observability.svc.cluster.local,credential-broker.observability.svc.cluster.local"
frontend:
  enabled: true
queryApi:
  enabled: true
  authRequireFirstLoginPasswordChange: false
  k8sInsecureSkipVerify: "true"
  localCredentialSecretName: aiops-local-cluster-kubeconfig
ingest:
  enabled: true
aiOrchestrator:
  # Chat Gateway remains enabled for the real Query -> Orchestrator SSE path;
  # investigation execution stays in the independent Worker below.
  enabled: true
  llmMock: "true"
  queryApiUrl: "https://query-api.observability.svc.cluster.local:8080/api/v1"
  investigationRuntimeEnabled: "0"
  legacyFlowRuntimeEnabled: "0"
  investigatorEnabled: "0"
  legacyDirectMutationsEnabled: "0"
investigationWorker:
  enabled: true
  # 2026-09-04 业务决策：自研中心服务统一单副本，不要求服务级 HA。
  replicas: 1
  image:
    repository: ai-orchestrator
    tag: "{{ .Values.global.imageTag }}"
llmEgressProxy:
  enabled: true
aiActionExecutor:
  enabled: true
  # PF-LOGIC-010 修复（2026-09-06，用户授权）：审批后 Action 必须能真实执行。
  # approved + realMutation 走本地隔离真实 mutation 边界（专用 SA + 目标 namespace
  # 最小 RBAC，见 docs/runbooks/aiops-action-rollout.md §4）；生产 profile 仍为
  # disabled，且生产 approved 必须经 Credential Broker（Helm 渲染门禁强制）。
  executionMode: approved
  realMutation: true
  targetNamespaces:
    - aiops-canary
    - aiops-action-test
eventCollector:
  enabled: true
  ingestURL: "https://ingest.observability.svc.cluster.local:8080"
deepflow:
  enabled: false
graph:
  backend: hugegraph
  # The default 1500ms read timeout is too tight for the public kneighbor
  # traverser at limit=300 (observed ~1.55s end-to-end and GRAPH_UNAVAILABLE
  # 503s); give traverser reads headroom in this local profile.
  readTimeoutMs: 5000
hugeGraph:
  enabled: true
  # The 200k-vertex/1M-edge local gate exercises RocksDB caches and the
  # schema-defined edge indexes; the chart default (2Gi) exits under load on
  # a single-node OrbStack VM. Keep the larger 10Gi budget local-only so
  # production sizing remains an explicit capacity decision.
  resources:
    requests:
      cpu: "1"
      memory: "2Gi"
    limits:
      cpu: "4"
      memory: "10Gi"
# Local validation uses ephemeral storage; production backup schedules remain
# enabled through values-prod.yaml and an explicit storage class.
backup:
  enabled: false
