{{- if .Values.mysql.enabled }}
# V9.2 Phase 4 P4.8：MySQL schema 迁移 Job（schema-migrator）。
# 用 aiops_migrator 账号（唯一允许 DDL 的账号）执行版本化迁移，写入
# aiops_schema_migrations。顺序（P1-4）：MySQL ready → users-init (weight 10)
# → 本 Job (weight 20) → runtime Deployments (weight 30+)。
apiVersion: batch/v1
kind: Job
metadata:
  name: mysql-init
  namespace: {{ .Values.namespace.observability }}
  annotations:
    # On upgrade this must run before query-api readiness is evaluated: the
    # new binary's read-only schema check requires the migration below.
    # Fresh installs keep post-install ordering after MySQL is created.
    "helm.sh/hook": post-install,pre-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: mysql-init
spec:
  backoffLimit: 5
  template:
    spec:
      restartPolicy: OnFailure
      containers:
        - name: schema-migrator
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.mysql.migratorImage .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.mysqlMigrator | default "") "env" (.Values.global.environment | default "")) | quote }}
          command: ["/schema-migrator"]
          env:
            - name: MYSQL_HOST
              value: "mysql.{{ .Values.namespace.observability }}.svc.cluster.local"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "aiops_migrator"
            - name: MYSQL_DB
              value: "aiops"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_MIGRATOR_PASSWORD }
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: mysql-migrations
{{- end }}
