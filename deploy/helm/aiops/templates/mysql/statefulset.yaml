{{- if .Values.mysql.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: mysql
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: mysql
spec:
  serviceName: mysql
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免数据损坏）。
  # 如需多副本 HA，请改用专用有状态方案（如 PXC），勿直接放大此值。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: mysql
  template:
    metadata:
      labels:
        app: mysql
    spec:
      containers:
        - name: mysql
          image: {{ .Values.mysql.image }}
          env:
            - name: MYSQL_ROOT_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DATABASE
              value: "aiops"
          ports:
            - containerPort: 3306
          # P0-MYSQL-1: K8s exec 探针不做 $(VAR) 展开（password 会收到字面量 "$(MYSQL_ROOT_PASSWORD)"
          # 导致认证失败、探针失败/重启）。改用 sh -c shell 包装，让 shell 完成环境变量展开。
          readinessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["sh", "-c", "mysqladmin ping -h 127.0.0.1 -uroot -p\"$MYSQL_ROOT_PASSWORD\""]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.mysql.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/mysql
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.mysql.storageClass }}
        storageClassName: {{ .Values.mysql.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.mysql.storage }}
---
apiVersion: v1
kind: Service
metadata:
  name: mysql
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: mysql
spec:
  clusterIP: None
  # Publish the MySQL endpoint before readiness so post-install/pre-upgrade
  # bootstrap hooks can resolve the headless service while mysqld is starting.
  publishNotReadyAddresses: true
  selector:
    app: mysql
  ports:
    - port: 3306
      targetPort: 3306
{{- end }}
