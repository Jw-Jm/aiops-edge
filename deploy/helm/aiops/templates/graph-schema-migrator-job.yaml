{{- if .Values.hugeGraph.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: graph-schema-migrator
  namespace: {{ .Values.namespace.observability }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "30"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: graph-schema-migrator
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: graph-schema-migrator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-hugegraph
          image: docker.m.daocloud.io/library/busybox:1.36
          env:
            - name: HUGEGRAPH_USERNAME
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: HUGEGRAPH_USERNAME }
            - name: HUGEGRAPH_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: HUGEGRAPH_PASSWORD }
          command: ["/bin/sh", "-c"]
          args:
            - >-
              AUTH="$(printf '%s:%s' "$HUGEGRAPH_USERNAME" "$HUGEGRAPH_PASSWORD" | base64 | tr -d '\n')";
              until wget -q --header="Authorization: Basic ${AUTH}" -O- http://hugegraph:8080/graphs >/dev/null;
              do sleep 2; done
      containers:
        - name: graph-schema-migrator
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.hugeGraph.schemaMigratorImage .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.graphSchemaMigrator | default "") "env" (.Values.global.environment | default "")) | quote }}
          env:
            - name: HUGEGRAPH_URL
              value: "http://hugegraph:8080"
            - name: HUGEGRAPH_GRAPHSPACE
              value: {{ .Values.hugeGraph.graphspace | quote }}
            - name: HUGEGRAPH_GRAPH
              value: {{ .Values.hugeGraph.graph | quote }}
            - name: HUGEGRAPH_USERNAME
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: HUGEGRAPH_USERNAME }
            - name: HUGEGRAPH_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: HUGEGRAPH_PASSWORD }
            - name: MYSQL_HOST
              value: "mysql"
            - name: MYSQL_PORT
              value: "3306"
            - name: MYSQL_USER
              value: "aiops_migrator"
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_MIGRATOR_PASSWORD }
            - name: MYSQL_DB
              value: "aiops"
{{- end }}
