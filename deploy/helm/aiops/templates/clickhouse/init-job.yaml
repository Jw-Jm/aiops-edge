{{- if .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: clickhouse-init
spec:
  template:
    metadata:
      name: clickhouse-init
    spec:
      restartPolicy: Never
      containers:
        - name: init-tables
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "waiting for clickhouse..."
              until clickhouse-client --host clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local --query 'SELECT 1' >/dev/null 2>&1; do sleep 5; done
              echo "clickhouse ready, running init sql..."
              clickhouse-client --host clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local --multiquery < /init/init_clickhouse.sql
              echo "init done"
          volumeMounts:
            - name: init-sql
              mountPath: /init
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: clickhouse-init
{{- end }}
