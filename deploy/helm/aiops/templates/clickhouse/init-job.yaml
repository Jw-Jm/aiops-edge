{{- if .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-init
  namespace: {{ .Values.namespace.observability }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "10"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: clickhouse-init
spec:
  template:
    metadata:
      name: clickhouse-init
      labels:
        app: clickhouse-init
    spec:
      restartPolicy: Never
      containers:
        - name: init-tables
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              echo "waiting for clickhouse..."
              until clickhouse-client --host clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local --password "$CLICKHOUSE_PASSWORD" --query 'SELECT 1' >/dev/null 2>&1; do sleep 5; done
              echo "clickhouse ready, running init sql..."
              clickhouse-client --host clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local --password "$CLICKHOUSE_PASSWORD" --multiquery < /init/init_clickhouse.sql
              echo "init done"
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          volumeMounts:
            - name: init-sql
              mountPath: /init
              readOnly: true
      volumes:
        - name: init-sql
          configMap:
            name: clickhouse-init
{{- end }}
