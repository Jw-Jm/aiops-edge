{{- if .Values.clickhouse.enabled }}
apiVersion: batch/v1
kind: Job
metadata:
  name: clickhouse-migrator
  namespace: {{ .Values.namespace.observability }}
  annotations:
    "helm.sh/hook": post-install,post-upgrade
    "helm.sh/hook-weight": "20"
    "helm.sh/hook-delete-policy": before-hook-creation
  labels:
    app: clickhouse-migrator
spec:
  backoffLimit: 5
  template:
    metadata:
      labels:
        app: clickhouse-migrator
    spec:
      restartPolicy: OnFailure
      initContainers:
        - name: wait-clickhouse
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - >-
              until clickhouse-client --host clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local
              --password="$CLICKHOUSE_PASSWORD" --query 'SELECT 1' >/dev/null 2>&1;
              do sleep 5; done
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
      containers:
        - name: clickhouse-migrator
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.clickhouse.migratorImage .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.clickhouseMigrator | default "") "env" (.Values.global.environment | default "")) | quote }}
          command: ["/clickhouse-migrator"]
          env:
            - name: CLICKHOUSE_MIGRATIONS_DIR
              value: "/migrations"
            - name: CLICKHOUSE_URL
              value: "http://clickhouse.{{ .Values.namespace.observability }}.svc.cluster.local:8123"
            - name: CLICKHOUSE_USER
              value: "default"
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          volumeMounts:
            - name: migrations
              mountPath: /migrations
              readOnly: true
      volumes:
        - name: migrations
          configMap:
            name: clickhouse-migrations
{{- end }}
