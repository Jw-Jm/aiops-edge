{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免数据损坏）。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # init 容器：为 default 用户启用密码认证并限制可访问网络。
      # 镜像默认 default-user.xml 仅限本机（pod 内跨主机访问 403），此处生成 users.d 配置覆盖网络+密码：
      #  - networks 由 values.clickhouse.userNetworks 控制（G5：不再开放 ::/0，默认仅私有网段，
      #    生产收紧为实际 pod CIDR；网络层隔离由 NetworkPolicy 兜底）
      #  - password_sha256_hex 由 Secret 的 CLICKHOUSE_PASSWORD 实时计算，与 query-api/ingest/orchestrator
      #    注入的 CLICKHOUSE_PASSWORD 保持一致（P0-2：落地 ClickHouse 认证，消除死密钥）。
      initContainers:
        - name: gen-ch-network
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /etc/clickhouse-server/users.d
              HASH=$(printf '%s' "$CLICKHOUSE_PASSWORD" | sha256sum | awk '{print $1}')
              # P0-2 修复: 镜像默认 users.xml 的 default 用户已声明认证字段(空 password),
              # 直接新增 password_sha256_hex 会触发 ClickHouse "More than one field ... used to
              # specify authentication info for user default"(exit 36, 部署崩溃)。
              # 因此先 remove 掉默认认证字段, 再写 sha256 密码, 并限制网络。
              {
                echo "<clickhouse>"
                echo "  <users>"
                echo "    <default>"
                echo '      <password remove="1"/>'
                echo '      <no_password remove="1"/>'
                echo "      <password_sha256_hex>${HASH}</password_sha256_hex>"
                echo "      <networks>"
                for IP in {{ .Values.clickhouse.userNetworks | join " " }}; do
                  echo "        <ip>${IP}</ip>"
                done
                echo "      </networks>"
                echo "    </default>"
                echo "  </users>"
                echo "</clickhouse>"
              } > /etc/clickhouse-server/users.d/default-password.xml
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          volumeMounts:
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          env:
            # 探针专用: 用 CH_PROBE_PASSWORD 而非 CLICKHOUSE_PASSWORD —— 官方 entrypoint
            # 会读取 CLICKHOUSE_PASSWORD 并尝试"create new user", 与 init 生成的
            # users.d 密码配置冲突导致崩溃; 换名后 entrypoint 不干预, 密码认证
            # 完全由 init 容器的 users.d/default-password.xml 负责。
            - name: CH_PROBE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          # P0-CH-1: K8s exec 探针不做 $(VAR) 展开（password 会收到字面量 "$(CH_PROBE_PASSWORD)"
          # 导致认证失败、探针失败/重启）。改用 sh -c shell 包装，让 shell 完成环境变量展开。
          readinessProbe:
            exec:
              command: ["sh", "-c", "clickhouse-client --host 127.0.0.1 --password=\"$CH_PROBE_PASSWORD\" --query \"SELECT 1\""]
            initialDelaySeconds: 20
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            exec:
              command: ["sh", "-c", "clickhouse-client --host 127.0.0.1 --password=\"$CH_PROBE_PASSWORD\" --query \"SELECT 1\""]
            initialDelaySeconds: 30
            periodSeconds: 15
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
      volumes:
        - name: users-d
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.clickhouse.storageClass }}
        storageClassName: {{ .Values.clickhouse.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
{{- end }}
