{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免数据损坏）。
  # 如需多副本 HA，请改用专用有状态方案，勿直接放大此值。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # init 容器基于 Secret 的 CLICKHOUSE_PASSWORD 动态生成含 sha256 密码的
      # users.d 配置，杜绝"空密码 + 任意来源"裸奔。
      initContainers:
        - name: gen-ch-auth
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /etc/clickhouse-server/users.d
              # 计算密码 sha256（ClickHouse 支持 password_sha256_hex），写入 users.d
              HASH=$(printf '%s' "$CH_PASSWORD" | sha256sum | awk '{print $1}')
              cat > /etc/clickhouse-server/users.d/allow-remote.xml <<EOF
              <clickhouse>
                <users>
                  <default>
                    <password_sha256_hex>$HASH</password_sha256_hex>
                    <networks>
                      <ip>::/0</ip>
                    </networks>
                  </default>
                </users>
              </clickhouse>
              EOF
          env:
            - name: CH_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          volumeMounts:
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          readinessProbe:
            exec:
              command: ["clickhouse-client", "--host", "127.0.0.1", "--password", "$(CLICKHOUSE_PASSWORD)", "--query", "SELECT 1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["clickhouse-client", "--host", "127.0.0.1", "--password", "$(CLICKHOUSE_PASSWORD)", "--query", "SELECT 1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          env:
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
            - name: profiles-config
              mountPath: /etc/clickhouse-server/users.d/profiles.xml
              subPath: profiles.xml
              readOnly: true
      volumes:
        - name: users-d
          emptyDir: {}
        - name: profiles-config
          configMap:
            name: clickhouse-remote
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.clickhouse.storageClass }}
        storageClassName: {{ .Values.clickhouse.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
{{- end }}
