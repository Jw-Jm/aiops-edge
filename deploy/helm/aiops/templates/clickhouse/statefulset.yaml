{{- if .Values.clickhouse.enabled }}
apiVersion: apps/v1
kind: StatefulSet
metadata:
  name: clickhouse
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: clickhouse
spec:
  serviceName: clickhouse
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免数据损坏）。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: clickhouse
  template:
    metadata:
      labels:
        app: clickhouse
    spec:
      # init 容器放开 default 用户网络为 ::/0（镜像默认 default-user.xml 仅限本机，
      # 导致 pod 内跨主机访问 403）。仅放开网络、不设密码（凭集群网络隔离保护；
      # 如需密码认证，可在此加 password_sha256_hex，与 entrypoint 不冲突）。
      initContainers:
        - name: gen-ch-network
          image: {{ .Values.clickhouse.image }}
          command: ["/bin/sh", "-c"]
          args:
            - |
              set -e
              mkdir -p /etc/clickhouse-server/users.d
              cat > /etc/clickhouse-server/users.d/allow-remote.xml <<'EOF'
              <clickhouse>
                <users>
                  <default>
                    <networks>
                      <ip>::/0</ip>
                    </networks>
                  </default>
                </users>
              </clickhouse>
              EOF
          volumeMounts:
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
      containers:
        - name: clickhouse
          image: {{ .Values.clickhouse.image }}
          ports:
            - containerPort: 8123
              name: http
            - containerPort: 9000
              name: native
          readinessProbe:
            exec:
              command: ["clickhouse-client", "--host", "127.0.0.1", "--query", "SELECT 1"]
            initialDelaySeconds: 20
            periodSeconds: 10
          livenessProbe:
            exec:
              command: ["clickhouse-client", "--host", "127.0.0.1", "--query", "SELECT 1"]
            initialDelaySeconds: 30
            periodSeconds: 15
          resources:
            {{- toYaml .Values.clickhouse.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /var/lib/clickhouse
            - name: users-d
              mountPath: /etc/clickhouse-server/users.d
      volumes:
        - name: users-d
          emptyDir: {}
  volumeClaimTemplates:
    - metadata:
        name: data
      spec:
        accessModes: ["ReadWriteOnce"]
        {{- if .Values.clickhouse.storageClass }}
        storageClassName: {{ .Values.clickhouse.storageClass }}
        {{- end }}
        resources:
          requests:
            storage: {{ .Values.clickhouse.storage }}
{{- end }}
