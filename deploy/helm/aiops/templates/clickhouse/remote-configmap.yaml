{{- if .Values.clickhouse.enabled }}
# 允许 default 用户远程连接（query-api/ingest 跨 pod 访问）
# ClickHouse 默认 default 用户仅限 localhost，此处覆盖为允许集群网络内任意来源
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-remote
  namespace: {{ .Values.namespace.observability }}
data:
  allow-remote.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_threads>8</max_threads>
        </default>
      </profiles>
      <users>
        <default>
          <password></password>
          <networks>
            <ip>::/0</ip>
          </networks>
        </default>
      </users>
    </clickhouse>
{{- end }}
