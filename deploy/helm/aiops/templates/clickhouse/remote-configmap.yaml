{{- if .Values.clickhouse.enabled }}
# 基础 profiles 配置（不带任何用户/密码——用户认证由 init 容器基于 Secret 动态生成，
# 避免在 ConfigMap 中写死空密码/弱口令）。
apiVersion: v1
kind: ConfigMap
metadata:
  name: clickhouse-remote
  namespace: {{ .Values.namespace.observability }}
data:
  profiles.xml: |
    <clickhouse>
      <profiles>
        <default>
          <max_threads>8</max_threads>
        </default>
      </profiles>
    </clickhouse>
{{- end }}
