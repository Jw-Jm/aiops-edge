{{- if .Values.ipmiExporter.enabled }}
# ipmi-exporter DaemonSet — 每节点本地采集 IPMI 传感器（/dev/ipmi0，不走带外网）
# 用 ipmitool 读 BMC 硬件健康（温度/风扇/电压/电源），经管理网上报 ai-orchestrator
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: ipmi-exporter
  namespace: {{ .Values.namespace.observability }}
  labels:
    app.kubernetes.io/name: ipmi-exporter
    component: ipmi-exporter
spec:
  selector:
    matchLabels:
      app.kubernetes.io/name: ipmi-exporter
  template:
    metadata:
      labels:
        app.kubernetes.io/name: ipmi-exporter
    spec:
      tolerations:
        - operator: Exists
      containers:
        - name: ipmi-exporter
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.ipmiExporter.image .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.ipmiExporter | default "") "env" (.Values.global.environment | default "")) | quote }}
          imagePullPolicy: {{ .Values.ipmiExporter.imagePullPolicy | default "IfNotPresent" }}
          securityContext:
            privileged: true
          env:
            - name: NODE_NAME
              valueFrom:
                fieldRef:
                  fieldPath: spec.nodeName
            - name: ORCHESTRATOR_URL
              value: "http://ai-orchestrator:8080/api/v1/ipmi/ingest"
            - name: COLLECT_INTERVAL
              value: {{ .Values.ipmiExporter.collectInterval | quote }}
          volumeMounts:
            - name: ipmi
              mountPath: /dev/ipmi0
              readOnly: true
      volumes:
        - name: ipmi
          hostPath:
            path: /dev/ipmi0
{{- end }}
