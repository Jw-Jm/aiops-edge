{{- if .Values.victoriaMetrics.enabled }}
# VictoriaMetrics k8s SD 权限：让 VM 用 kubernetes_sd_configs 自动发现 node-exporter DaemonSet pod。
# VM 通过 ServiceAccount token 直连 K8s API 读取 pod/endpoints 元数据，无需硬编码节点 IP（多节点自动发现）。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: victoria-metrics-k8s-sd
  labels:
    app: victoria-metrics
rules:
- apiGroups: [""]
  resources: ["pods", "services", "endpoints"]
  verbs: ["get", "list", "watch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: victoria-metrics-k8s-sd
  labels:
    app: victoria-metrics
subjects:
- kind: ServiceAccount
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: ClusterRole
  name: victoria-metrics-k8s-sd
  apiGroup: rbac.authorization.k8s.io
{{- end }}
