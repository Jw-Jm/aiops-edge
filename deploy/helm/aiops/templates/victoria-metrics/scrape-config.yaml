{{- if .Values.victoriaMetrics.enabled }}
# VictoriaMetrics 内置 scrape 配置 — 抓 node-exporter(OS) + ingest(服务RED) + orchestrator
# VM 单实例通过 -promscrape.config 直接抓取（组件最小化，无需 vmagent）
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-scrape-config
  namespace: {{ .Values.namespace.observability }}
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      # node-exporter 用 kubernetes_sd_configs 自动发现 DaemonSet pod。
      # 注：keep 用 __meta_* 标签选目标；若采样后 __meta_* 消失导致样本被丢，则改用
      # __meta_kubernetes_pod_name 前缀匹配兜底（见 git 历史排查）。当前已验证 keep 是丢样本元凶。
      - job_name: node-exporter
        kubernetes_sd_configs:
          - role: pod
        relabel_configs:
          - source_labels: [__meta_kubernetes_pod_name]
            regex: node-exporter-.*
            action: keep
          - source_labels: [__meta_kubernetes_pod_ip]
            action: replace
            target_label: __address__
            replacement: ${1}:9100
          - action: labelmap
            regex: __meta_kubernetes_pod_name
            replacement: instance
      - job_name: ingest
        scheme: {{ include "aiops.internalScheme" . }}
        {{- if .Values.internalTLS.enabled }}
        tls_config:
          ca_file: /etc/vm/tls/ca.crt
          insecure_skip_verify: false
        {{- end }}
        static_configs:
          - targets: ['ingest:{{ .Values.ingestPort }}']
            labels:
              job: ingest
      - job_name: orchestrator
        scheme: {{ include "aiops.internalScheme" . }}
        {{- if .Values.internalTLS.enabled }}
        tls_config:
          ca_file: /etc/vm/tls/ca.crt
          insecure_skip_verify: false
        {{- end }}
        static_configs:
          - targets: ['ai-orchestrator:{{ .Values.orchestratorPort }}']
            labels:
              job: orchestrator
      # 自监控（方案 9.3）：query-api 自身指标（免鉴权 /metrics，见 metrics.go）
      - job_name: query-api
        scheme: {{ include "aiops.internalScheme" . }}
        {{- if .Values.internalTLS.enabled }}
        tls_config:
          ca_file: /etc/vm/tls/ca.crt
          insecure_skip_verify: false
        {{- end }}
        static_configs:
          - targets: ['query-api:8080']
            labels:
              job: query-api
{{- end }}
