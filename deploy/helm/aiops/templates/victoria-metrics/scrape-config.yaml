{{- if .Values.victoriaMetrics.enabled }}
# VictoriaMetrics 内置 scrape 配置 — 抓 node-exporter(OS) + ingest(服务RED) + orchestrator
# VM 单实例通过 -promscrape.config 直接抓取（组件最小化，无需 vmagent）
apiVersion: v1
kind: ConfigMap
metadata:
  name: vm-scrape-config
  namespace: {{ .Values.namespace.observability }}
data:
  scrape.yml: |
    global:
      scrape_interval: 15s
    scrape_configs:
      - job_name: node-exporter
        static_configs:
          - targets: ['{{ .Values.nodeExporterTarget }}:9100']
            labels:
              job: node-exporter
      - job_name: ingest
        static_configs:
          - targets: ['ingest:{{ .Values.ingestPort }}']
            labels:
              job: ingest
      - job_name: orchestrator
        static_configs:
          - targets: ['ai-orchestrator:{{ .Values.orchestratorPort }}']
            labels:
              job: orchestrator
{{- end }}
