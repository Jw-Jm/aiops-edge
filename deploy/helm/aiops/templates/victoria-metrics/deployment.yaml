{{- if .Values.victoriaMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: victoria-metrics
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
        - name: victoria-metrics
          image: {{ .Values.victoriaMetrics.image }}
          args:
            - "-storageDataPath=/vmdata"
            - "-retentionPeriod=30d"
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /vmdata
  volumes:
    - name: data
      persistentVolumeClaim:
        claimName: vm-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
    - port: 8428
      targetPort: 8428
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  storageClassName: {{ .Values.victoriaMetrics.storageClass | default "" | quote }}
  resources:
    requests:
      storage: {{ .Values.victoriaMetrics.storage }}
{{- end }}
