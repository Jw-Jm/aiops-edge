{{- if .Values.victoriaMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: victoria-metrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      containers:
        - name: victoria-metrics
          image: {{ .Values.victoriaMetrics.image }}
          args:
            - "-storageDataPath=/vmdata"
            - "-retentionPeriod=30d"
            - "-promscrape.config=/etc/vm/scrape.yml"
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /vmdata
            - name: scrape-config
              mountPath: /etc/vm
              readOnly: true
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vm-data
        - name: scrape-config
          configMap:
            name: vm-scrape-config
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
    - port: 8428
      targetPort: 8428
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.victoriaMetrics.storageClass }}
  storageClassName: {{ .Values.victoriaMetrics.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.victoriaMetrics.storage }}
{{- end }}
