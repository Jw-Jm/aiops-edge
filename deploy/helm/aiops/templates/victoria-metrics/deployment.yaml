{{- if .Values.victoriaMetrics.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免挂载失败/数据损坏）。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: victoria-metrics
  strategy:
    type: Recreate
  template:
    metadata:
      labels:
        app: victoria-metrics
    spec:
      serviceAccountName: victoria-metrics
      containers:
        - name: victoria-metrics
          image: {{ .Values.victoriaMetrics.image }}
          args:
            - "-storageDataPath=/vmdata"
            - "-retentionPeriod=30d"
            - "-promscrape.config=/etc/vm/scrape.yml"
          ports:
            - containerPort: 8428
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8428 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.victoriaMetrics.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /vmdata
            - name: scrape-config
              mountPath: /etc/vm
              readOnly: true
            {{- if .Values.internalTLS.enabled }}
            - name: internal-tls-ca
              mountPath: /etc/vm/tls
              readOnly: true
            {{- end }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vm-data
        - name: scrape-config
          configMap:
            name: vm-scrape-config
        {{- if .Values.internalTLS.enabled }}
        - name: internal-tls-ca
          secret:
            secretName: {{ .Values.internalTLS.secretName }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
        {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-metrics
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-metrics
spec:
  selector:
    app: victoria-metrics
  ports:
    - port: 8428
      targetPort: 8428
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vm-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.victoriaMetrics.storageClass }}
  storageClassName: {{ .Values.victoriaMetrics.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.victoriaMetrics.storage }}
{{- end }}
