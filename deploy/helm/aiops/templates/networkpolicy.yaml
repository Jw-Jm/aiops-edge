{{- if and .Values.vmalert.enabled $denyAll }}
---
# vmalert reads and remote-writes VictoriaMetrics.  The notifier is empty in
# the chart; external notification must be added through an approved proxy.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-vmalert-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: vmalert
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: victoria-metrics
      ports:
        - protocol: TCP
          port: 8428
    - to:
{{ toYaml $dnsTo | indent 8 }}
      ports:
{{ toYaml $dnsPorts | indent 8 }}
{{- end }}
{{- end }}
{{- if .Values.llmEgressProxy.enabled }}
---
# C-04（报告 §19）：ai-llm-egress-proxy 是 LLM 出站唯一代理。
#   【入站】orchestrator → proxy（本命名空间内）。
#   【出站】proxy → 外部 LLM 域名（deepseek/openai 等，按 CIDR/域名配置）；其余出站拒绝。
#   orchestrator/agent/frontend 不再直接出站到 LLM（default-deny egress 下仅 proxy 有 LLM 出站）。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-proxy-ingress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: ai-llm-egress-proxy
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: ai-orchestrator
        - podSelector:
            matchLabels:
              app: ai-investigation-worker
      ports:
        - protocol: TCP
          port: 8080
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-llm-proxy-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: ai-llm-egress-proxy
  policyTypes: ["Egress"]
  egress:
    - to:
{{- if .Values.llmEgressProxy.allowlistCidrs }}
{{ toYaml .Values.llmEgressProxy.allowlistCidrs | indent 8 }}
{{- else }}
        - ipBlock:
            cidr: 0.0.0.0/0
{{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- if .Values.llmEgressProxy.allowDns }}
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
{{- if .Values.aiActionExecutor.enabled }}
---
# Stage D（F-22）：ai-action-executor 是独立 mutation 边界。
#   【入站】query-api → executor（唯一调用方）；executor 无出站 mutation 之外的网络。
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-action-executor-ingress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: ai-action-executor
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: query-api-http
      ports:
        - protocol: TCP
          port: 8080
{{- if $denyAll }}
---
# Approved executor egress is limited to the credential broker and the
# Kubernetes API.  No direct database or public-network path is granted.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-action-executor-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: ai-action-executor
  policyTypes: ["Egress"]
  egress:
{{- if .Values.credentialBroker.enabled }}
    - to:
        - podSelector:
            matchLabels:
              app: ai-credential-broker
      ports:
        - protocol: TCP
          port: 8080
{{- end }}
{{- if $apiCIDRs }}
    - to:
{{- range $cidr := $apiCIDRs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
    - to:
{{ toYaml $dnsTo | indent 8 }}
      ports:
{{ toYaml $dnsPorts | indent 8 }}
{{- end }}
{{- end }}
{{- if and .Values.credentialBroker.enabled $denyAll }}
---
# Credential Broker only exchanges registered refs through the Kubernetes
# TokenRequest API; it has no data-plane or public egress.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-credential-broker-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: ai-credential-broker
  policyTypes: ["Egress"]
  egress:
{{- if $apiCIDRs }}
    - to:
{{- range $cidr := $apiCIDRs }}
        - ipBlock:
            cidr: {{ $cidr | quote }}
{{- end }}
      ports:
        - protocol: TCP
          port: 443
{{- end }}
    - to:
{{ toYaml $dnsTo | indent 8 }}
      ports:
{{ toYaml $dnsPorts | indent 8 }}
{{- end }}
