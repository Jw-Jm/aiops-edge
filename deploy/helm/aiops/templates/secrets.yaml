{{- /*
  MinIO 凭证生成：生产必须通过 secrets.minioAccessKey/SecretKey 显式注入强口令。
  未显式提供时，优先复用已存在 Secret 中的值（helm lookup，幂等），否则随机生成
  （randAlphaNum），杜绝官方弱默认值（minioadmin/minioadmin123）。
*/}}
{{- $existing := (lookup "v1" "Secret" .Values.namespace.observability "aiops-secrets").data | default dict }}
{{- $minioAccessKey := .Values.secrets.minioAccessKey | default (index $existing "MINIO_ACCESS_KEY" | default (randAlphaNum 16 | b64enc) | b64dec) }}
{{- $minioSecretKey := .Values.secrets.minioSecretKey | default (index $existing "MINIO_SECRET_KEY" | default (randAlphaNum 32 | b64enc) | b64dec) }}
apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: {{ .Values.namespace.observability }}
type: Opaque
stringData:
  # JWT_SECRET / LLM_ENCRYPTION_KEY 必须非空（长度 >=32 由 query-api 启动强校验兜底）
  JWT_SECRET: {{ required "secrets.jwtSecret 必须注入（query-api 启动强校验>=32字符）" .Values.secrets.jwtSecret | quote }}
  LLM_ENCRYPTION_KEY: {{ required "secrets.llmEncryptionKey 必须注入（query-api 启动强校验>=32字节）" .Values.secrets.llmEncryptionKey | quote }}
  INTERNAL_TOKEN: {{ required "secrets.internalToken 必须注入" .Values.secrets.internalToken | quote }}
  INGEST_API_KEY: {{ required "secrets.ingestApiKey 必须注入" .Values.secrets.ingestApiKey | quote }}
  CLICKHOUSE_PASSWORD: {{ required "secrets.clickhousePassword 必须注入" .Values.secrets.clickhousePassword | quote }}
  REDIS_PASSWORD: {{ required "secrets.redisPassword 必须注入（Redis 已启用 requirepass）" .Values.secrets.redisPassword | quote }}
  MINIO_ACCESS_KEY: {{ required "secrets.minioAccessKey 必须注入（>=3 字符）" $minioAccessKey | quote }}
  MINIO_SECRET_KEY: {{ required "secrets.minioSecretKey 必须注入（>=8 字符）" $minioSecretKey | quote }}
  MYSQL_ROOT_PASSWORD: {{ required "secrets.mysqlRootPassword 必须注入" .Values.secrets.mysqlRootPassword | quote }}
