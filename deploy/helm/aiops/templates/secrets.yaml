apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: {{ .Values.namespace.observability }}
type: Opaque
stringData:
  # G5 加固：所有密钥经 aiops.requireSecret 校验，空值或 CHANGE_ME 占位符直接渲染失败，
  # 杜绝"占位符通过 required 校验直接部署"。
  # JWT_SECRET / LLM_ENCRYPTION_KEY 必须非空（长度 >=32 由 query-api 启动强校验兜底）
  JWT_SECRET: {{ include "aiops.requireSecret" (dict "name" "secrets.jwtSecret" "value" .Values.secrets.jwtSecret) | quote }}
  LLM_ENCRYPTION_KEY: {{ include "aiops.requireSecret" (dict "name" "secrets.llmEncryptionKey" "value" .Values.secrets.llmEncryptionKey) | quote }}
  INTERNAL_TOKEN: {{ include "aiops.requireSecret" (dict "name" "secrets.internalToken" "value" .Values.secrets.internalToken) | quote }}
  # V9.2 Service Identity — four independent credential/key groups (P3.5 infra).
  # Service credentials are independent per direction; signing keys are independent per direction.
  ORCHESTRATOR_TO_QUERY_TOKEN: {{ include "aiops.requireSecretWhen" (dict "enabled" (or .Values.aiOrchestrator.enabled .Values.investigationWorker.enabled) "name" "secrets.orchestratorToQueryToken" "value" .Values.secrets.orchestratorToQueryToken) | quote }}
  ORCHESTRATOR_TO_QUERY_SIGNING_KEY: {{ include "aiops.requireSecretWhen" (dict "enabled" (or .Values.aiOrchestrator.enabled .Values.investigationWorker.enabled) "name" "secrets.orchestratorToQuerySigningKey" "value" .Values.secrets.orchestratorToQuerySigningKey) | quote }}
  ORCHESTRATOR_TO_QUERY_VERIFY_KEYS: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.queryApi.enabled "name" "secrets.orchestratorToQueryVerifyKeys" "value" .Values.secrets.orchestratorToQueryVerifyKeys) | quote }}
  QUERY_TO_ORCHESTRATOR_TOKEN: {{ include "aiops.requireSecretWhen" (dict "enabled" (or .Values.queryApi.enabled .Values.aiOrchestrator.enabled .Values.investigationWorker.enabled) "name" "secrets.queryToOrchestratorToken" "value" .Values.secrets.queryToOrchestratorToken) | quote }}
  QUERY_TO_ORCHESTRATOR_SIGNING_KEY: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.queryApi.enabled "name" "secrets.queryToOrchestratorSigningKey" "value" .Values.secrets.queryToOrchestratorSigningKey) | quote }}
  QUERY_TO_ORCHESTRATOR_VERIFY_KEYS: {{ include "aiops.requireSecretWhen" (dict "enabled" (or .Values.aiOrchestrator.enabled .Values.investigationWorker.enabled) "name" "secrets.queryToOrchestratorVerifyKeys" "value" .Values.secrets.queryToOrchestratorVerifyKeys) | quote }}
  INGEST_API_KEY: {{ include "aiops.requireSecret" (dict "name" "secrets.ingestApiKey" "value" .Values.secrets.ingestApiKey) | quote }}
  CLICKHOUSE_PASSWORD: {{ include "aiops.requireSecret" (dict "name" "secrets.clickhousePassword" "value" .Values.secrets.clickhousePassword) | quote }}
  MYSQL_ROOT_PASSWORD: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.mysql.enabled "name" "secrets.mysqlRootPassword" "value" .Values.secrets.mysqlRootPassword) | quote }}
  MYSQL_APP_PASSWORD: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.mysql.enabled "name" "secrets.mysqlAppPassword" "value" .Values.secrets.mysqlAppPassword) | quote }}
  MYSQL_MIGRATOR_PASSWORD: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.mysql.enabled "name" "secrets.mysqlMigratorPassword" "value" .Values.secrets.mysqlMigratorPassword) | quote }}
  ADMIN_INITIAL_PASSWORD: {{ .Values.secrets.adminInitialPassword | default "" | quote }}
  # C-04：LLM 出站唯一代理凭据（Provider key 只存于 proxy；orchestrator 不出站直连 LLM）。
  LLM_PROXY_TOKEN: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.llmEgressProxy.enabled "name" "secrets.llmProxyToken" "value" .Values.secrets.llmProxyToken) | quote }}
  LLM_PROVIDER_KEYS: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.llmEgressProxy.enabled "name" "secrets.llmProviderKeys" "value" .Values.secrets.llmProviderKeys) | quote }}
  # Stage D：ai-action-executor 调用方（Query API）出示的 token；空则 executor 不校验（默认 disabled 安全）。
  EXECUTOR_TOKEN: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.aiActionExecutor.enabled "name" "secrets.executorToken" "value" .Values.secrets.executorToken) | quote }}
  # Stage D：Query API 签发 signed ActionExecutionContext 的独立 Ed25519 私钥
  # （不复用 QUERY_TO_ORCHESTRATOR_SIGNING_KEY）。executor 持对应公钥验签。
  # 空则 query-api 的 executor client fail-closed（执行端点 EXECUTOR_UNAVAILABLE，不静默执行）。
  AI_ACTION_EXECUTOR_SIGNING_KEY: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.aiActionExecutor.enabled "name" "secrets.aiActionExecutorSigningKey" "value" .Values.secrets.aiActionExecutorSigningKey) | quote }}
  # query-api → executor 的独立验签公钥；禁止复用 QUERY_TO_ORCHESTRATOR_VERIFY_KEYS。
  AI_ACTION_EXECUTOR_VERIFY_KEYS: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.aiActionExecutor.enabled "name" "secrets.aiActionExecutorVerifyKeys" "value" .Values.secrets.aiActionExecutorVerifyKeys) | quote }}
  HUGEGRAPH_USERNAME: {{ .Values.hugeGraph.username | default "admin" | quote }}
  HUGEGRAPH_PASSWORD: {{ include "aiops.requireSecretWhen" (dict "enabled" .Values.hugeGraph.enabled "name" "secrets.hugeGraphPassword" "value" .Values.secrets.hugeGraphPassword) | quote }}
