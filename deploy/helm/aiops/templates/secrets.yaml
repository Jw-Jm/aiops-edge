apiVersion: v1
kind: Secret
metadata:
  name: aiops-secrets
  namespace: {{ .Values.namespace.observability }}
type: Opaque
stringData:
  # G5 加固：所有密钥经 aiops.requireSecret 校验，空值或 CHANGE_ME 占位符直接渲染失败，
  # 杜绝"占位符通过 required 校验直接部署"。
  # JWT_SECRET / LLM_ENCRYPTION_KEY 必须非空（长度 >=32 由 query-api 启动强校验兜底）
  JWT_SECRET: {{ include "aiops.requireSecret" (dict "name" "secrets.jwtSecret" "value" .Values.secrets.jwtSecret) | quote }}
  LLM_ENCRYPTION_KEY: {{ include "aiops.requireSecret" (dict "name" "secrets.llmEncryptionKey" "value" .Values.secrets.llmEncryptionKey) | quote }}
  INTERNAL_TOKEN: {{ include "aiops.requireSecret" (dict "name" "secrets.internalToken" "value" .Values.secrets.internalToken) | quote }}
  # V9.2 Service Identity — four independent credential/key groups (P3.5 infra).
  # Service credentials are independent per direction; signing keys are independent per direction.
  ORCHESTRATOR_TO_QUERY_TOKEN: {{ .Values.secrets.orchestratorToQueryToken | default "" | quote }}
  ORCHESTRATOR_TO_QUERY_SIGNING_KEY: {{ .Values.secrets.orchestratorToQuerySigningKey | default "" | quote }}
  ORCHESTRATOR_TO_QUERY_VERIFY_KEYS: {{ .Values.secrets.orchestratorToQueryVerifyKeys | default "" | quote }}
  QUERY_TO_ORCHESTRATOR_TOKEN: {{ .Values.secrets.queryToOrchestratorToken | default "" | quote }}
  QUERY_TO_ORCHESTRATOR_SIGNING_KEY: {{ .Values.secrets.queryToOrchestratorSigningKey | default "" | quote }}
  QUERY_TO_ORCHESTRATOR_VERIFY_KEYS: {{ .Values.secrets.queryToOrchestratorVerifyKeys | default "" | quote }}
  INGEST_API_KEY: {{ include "aiops.requireSecret" (dict "name" "secrets.ingestApiKey" "value" .Values.secrets.ingestApiKey) | quote }}
  CLICKHOUSE_PASSWORD: {{ include "aiops.requireSecret" (dict "name" "secrets.clickhousePassword" "value" .Values.secrets.clickhousePassword) | quote }}
  MYSQL_ROOT_PASSWORD: {{ include "aiops.requireSecret" (dict "name" "secrets.mysqlRootPassword" "value" .Values.secrets.mysqlRootPassword) | quote }}
  ADMIN_INITIAL_PASSWORD: {{ .Values.secrets.adminInitialPassword | default "" | quote }}
  # C-04：LLM 出站唯一代理凭据（Provider key 只存于 proxy；orchestrator 不出站直连 LLM）。
  LLM_PROXY_TOKEN: {{ .Values.secrets.llmProxyToken | default "" | quote }}
  LLM_PROVIDER_KEYS: {{ .Values.secrets.llmProviderKeys | default "" | quote }}
  # Stage D：ai-action-executor 调用方（Query API）出示的 token；空则 executor 不校验（默认 disabled 安全）。
  EXECUTOR_TOKEN: {{ .Values.secrets.executorToken | default "" | quote }}
  # Stage D：Query API 签发 signed ActionExecutionContext 的独立 Ed25519 私钥
  # （不复用 QUERY_TO_ORCHESTRATOR_SIGNING_KEY）。executor 持对应公钥验签。
  # 空则 query-api 的 executor client fail-closed（执行端点 EXECUTOR_UNAVAILABLE，不静默执行）。
  AI_ACTION_EXECUTOR_SIGNING_KEY: {{ .Values.secrets.aiActionExecutorSigningKey | default "" | quote }}
  # query-api → executor 的独立验签公钥；禁止复用 QUERY_TO_ORCHESTRATOR_VERIFY_KEYS。
  AI_ACTION_EXECUTOR_VERIFY_KEYS: {{ .Values.secrets.aiActionExecutorVerifyKeys | default "" | quote }}
