{{- if .Values.vmalert.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmalert
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: vmalert
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: vmalert
  template:
    metadata:
      labels:
        app: vmalert
    spec:
      containers:
        - name: vmalert
          image: {{ .Values.vmalert.image }}
          args:
            - "-datasource.url=http://victoria-metrics.{{ .Values.namespace.observability }}.svc.cluster.local:8428"
            - "-notifier.url="
            - "-remoteWrite.url=http://victoria-metrics.{{ .Values.namespace.observability }}.svc.cluster.local:8428"
            - "-rule=/etc/vmalert/rules/*.yaml"
          ports:
            - containerPort: 8880
          readinessProbe:
            httpGet: { path: /-/healthy, port: 8880 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /-/healthy, port: 8880 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.vmalert.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: vmalert
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: vmalert
spec:
  selector:
    app: vmalert
  ports:
    - port: 8880
      targetPort: 8880
{{- end }}
