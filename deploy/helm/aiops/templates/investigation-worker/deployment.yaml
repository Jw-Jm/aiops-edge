{{- if .Values.investigationWorker.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-investigation-worker
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-investigation-worker
spec:
  replicas: {{ .Values.investigationWorker.replicas | default 2 }}
  selector:
    matchLabels:
      app: ai-investigation-worker
  template:
    metadata:
      labels:
        app: ai-investigation-worker
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      # Worker data access is exclusively through signed Query API calls. It
      # must not inherit the orchestrator's Kubernetes read credentials.
      serviceAccountName: ai-investigation-worker
      automountServiceAccountToken: false
      containers:
        - name: investigation-worker
          image: {{ tpl .Values.investigationWorker.image.repository . }}:{{ tpl .Values.investigationWorker.image.tag . }}
          imagePullPolicy: IfNotPresent
          command: ["uvicorn"]
          args: ["investigation_app:app", "--host", "0.0.0.0", "--port", "8080", "--timeout-keep-alive", "120", "--limit-concurrency", "20"{{- if .Values.internalTLS.enabled }}, "--ssl-keyfile", "{{ .Values.internalTLS.keyFile }}", "--ssl-certfile", "{{ .Values.internalTLS.certFile }}", "--ssl-ca-certs", "{{ .Values.internalTLS.clientCAFile }}", "--ssl-cert-reqs", "1"{{- end }}]
          ports:
            - containerPort: 8080
          env:
            - name: AIOPS_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: AIOPS_DEPLOYMENT_MODE
              value: "production"
            - name: INVESTIGATION_WORKER_MODE
              value: "true"
            - name: INVESTIGATION_RUNTIME_ENABLED
              value: "1"
            - name: LEGACY_FLOW_RUNTIME_ENABLED
              value: "0"
            - name: LEGACY_DIRECT_MUTATIONS_ENABLED
              value: "0"
            - name: QUERY_API_URL
              value: {{ .Values.aiOrchestrator.queryApiUrl | quote }}
            - name: GRAPH_BACKEND
              value: {{ tpl (.Values.queryApi.graphBackend | default .Values.graph.backend) . | quote }}
            - name: GRAPH_SOURCE_RECONCILE_ENABLED
              value: "1"
            - name: AIOPS_SYSTEM_TENANT_ID
              value: {{ .Values.aiOrchestrator.systemTenantId | quote }}
            - name: AIOPS_SYSTEM_CLUSTER_ID
              value: {{ .Values.aiOrchestrator.systemClusterId | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INTERNAL_TOKEN }
            - name: TRUSTED_CONTEXT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: ORCHESTRATOR_TO_QUERY_SIGNING_KEY }
            - name: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS }
            - name: QUERY_TO_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_TOKEN }
            - name: LLM_MOCK
              value: {{ .Values.aiOrchestrator.llmMock | quote }}
            {{- include "aiops.mtlsEnv" . | nindent 12 }}
{{- if .Values.llmEgressProxy.enabled }}
            - name: LLM_PROXY_URL
              value: {{ printf "%s://ai-llm-egress-proxy.%s.svc.cluster.local:8080" (include "aiops.internalScheme" .) .Values.namespace.observability | quote }}
            - name: LLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: LLM_PROXY_TOKEN }
{{- end }}
          readinessProbe:
            {{- if .Values.internalTLS.enabled }}
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert {{ .Values.internalTLS.clientCAFile }}
                  --cert {{ .Values.internalTLS.certFile }} --key {{ .Values.internalTLS.keyFile }}
                  https://127.0.0.1:8080/readyz
            {{- else }}
            httpGet: { path: /readyz, port: 8080 }
            {{- end }}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            {{- if .Values.internalTLS.enabled }}
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert {{ .Values.internalTLS.clientCAFile }}
                  --cert {{ .Values.internalTLS.certFile }} --key {{ .Values.internalTLS.keyFile }}
                  https://127.0.0.1:8080/health
            {{- else }}
            httpGet: { path: /health, port: 8080 }
            {{- end }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.investigationWorker.resources | nindent 12 }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
      {{- if .Values.internalTLS.enabled }}
      volumes:
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
      {{- end }}
{{- end }}
