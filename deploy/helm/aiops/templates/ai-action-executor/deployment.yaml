{{- if and .Values.aiActionExecutor.enabled (eq (.Values.aiActionExecutor.executionMode | default "disabled") "approved") (not .Values.credentialBroker.enabled) (eq (.Values.global.environment | default "production") "production") }}
{{- fail "approved production executor requires credentialBroker.enabled" }}
{{- end }}
{{- if .Values.aiActionExecutor.enabled }}
# Stage D（报告 §21 / F-22）：ai-action-executor——独立生产 mutation 安全执行边界。
# Orchestrator / Query API API Pod 均不持生产写凭据；真实 mutation 只经本边界。
# EXECUTION_MODE=disabled 默认关闭真实执行（A-C + D 全闭环后才可开启 approved）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-action-executor
spec:
  replicas: {{ .Values.aiActionExecutor.replicas | default 1 }}
  selector:
    matchLabels:
      app: ai-action-executor
  template:
    metadata:
      labels:
        app: ai-action-executor
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      # Executor never uses a long-lived service-account token for mutation;
      # Credential Broker returns a short-lived TokenRequest token per action.
      serviceAccountName: {{ if .Values.credentialBroker.enabled }}ai-action-executor-broker-client{{ else }}default{{ end }}
      automountServiceAccountToken: false
      containers:
        - name: executor
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.aiActionExecutor.image.repository .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.aiActionExecutor | default "") "env" (.Values.global.environment | default "")) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: AIOPS_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: EXECUTOR_PORT
              value: "8080"
            - name: EXECUTION_MODE
              value: {{ .Values.aiActionExecutor.executionMode | default "disabled" | quote }}
            - name: EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: EXECUTOR_TOKEN
            - name: BROKER_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: CREDENTIAL_BROKER_TOKEN
            - name: CREDENTIAL_BROKER_URL
              value: {{ if .Values.aiActionExecutor.credentialBrokerUrl }}{{ .Values.aiActionExecutor.credentialBrokerUrl | quote }}{{ else if .Values.credentialBroker.enabled }}{{ printf "%s://ai-credential-broker.%s.svc.cluster.local:8080" (include "aiops.internalScheme" .) .Values.namespace.observability | quote }}{{ else }}""{{ end }}
            # Retained only as an explicit local-validation seam; production
            # credentials always arrive from the broker.
            - name: POD_SA_ACCESS
              value: "false"
            # D-Gate：所有已启用的执行器都验签 query-api 签发的执行上下文。
            # 即使 EXECUTION_MODE=disabled，也必须先通过签名校验再返回拒绝，
            # 这样受控测试和生产禁写路径都不会退化为仅依赖可选 token。
{{- if .Values.aiActionExecutor.enabled }}
            - name: EXECUTOR_VERIFY_KEYS
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: AI_ACTION_EXECUTOR_VERIFY_KEYS
{{- end }}
            {{- include "aiops.mtlsEnv" . | nindent 12 }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
              {{- if .Values.internalTLS.enabled }}
              scheme: HTTPS
              {{- end }}
            initialDelaySeconds: 5
            periodSeconds: 10
      {{- if .Values.internalTLS.enabled }}
      volumes:
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ai-action-executor
  ports:
    - port: 8080
      targetPort: 8080
      name: http
{{- if .Values.aiActionExecutor.realMutation }}
---
# Executor 专属 SA + 目标 namespace 白名单的 Deployment get/patch 权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
---
{{- range $targetNamespace := .Values.aiActionExecutor.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-action-executor
  namespace: {{ $targetNamespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments", "deployments/scale", "statefulsets", "statefulsets/scale", "daemonsets"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "delete"]
  - apiGroups: [""]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-action-executor
  namespace: {{ $targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: ai-action-executor
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: ai-action-executor
  apiGroup: rbac.authorization.k8s.io
{{- end }}
---
# Node actions and drain inventory are cluster-scoped. Workload/pod mutation
# remains namespace-scoped above; this ClusterRole only adds the minimal node
# and pod-list/eviction verbs needed by cordon/uncordon/drain.
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-action-executor-node
rules:
  - apiGroups: [""]
    resources: ["nodes"]
    verbs: ["get", "patch"]
  - apiGroups: [""]
    resources: ["pods"]
    verbs: ["get", "list"]
  - apiGroups: ["policy"]
    resources: ["pods/eviction"]
    verbs: ["create"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-action-executor-node
subjects:
  - kind: ServiceAccount
    name: ai-action-executor
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: ClusterRole
  name: ai-action-executor-node
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
