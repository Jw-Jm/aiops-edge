{{- if .Values.aiActionExecutor.enabled }}
# Stage D（报告 §21 / F-22）：ai-action-executor——独立生产 mutation 安全执行边界。
# Orchestrator / Query API API Pod 均不持生产写凭据；真实 mutation 只经本边界。
# EXECUTION_MODE=disabled 默认关闭真实执行（A-C + D 全闭环后才可开启 approved）。
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
  labels:
    app: ai-action-executor
spec:
  replicas: {{ .Values.aiActionExecutor.replicas | default 1 }}
  selector:
    matchLabels:
      app: ai-action-executor
  template:
    metadata:
      labels:
        app: ai-action-executor
    spec:
      # realMutation=true 时挂专属 SA（限定 targetNamespaces RBAC）启用真实 K8s mutation。
      serviceAccountName: {{ if .Values.aiActionExecutor.realMutation }}ai-action-executor{{ else }}default{{ end }}
      containers:
        - name: executor
          image: "{{ .Values.aiActionExecutor.image.repository }}:{{ tpl .Values.aiActionExecutor.image.tag . }}"
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
              name: http
          env:
            - name: EXECUTOR_PORT
              value: "8080"
            - name: EXECUTION_MODE
              value: {{ .Values.aiActionExecutor.executionMode | default "disabled" | quote }}
            - name: EXECUTOR_TOKEN
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: EXECUTOR_TOKEN
            - name: CREDENTIAL_BROKER_URL
              value: {{ .Values.aiActionExecutor.credentialBrokerUrl | default "" | quote }}
            # F5 已废除：realMutation=true 才启用真实 K8s mutation（in-cluster SA + 限定 RBAC）。
            - name: POD_SA_ACCESS
              value: {{ .Values.aiActionExecutor.realMutation | default false | quote }}
            # D-Gate（readiness）：approved 模式必须验签已签名执行上下文。
            # realMutation=true 时注入 query-api 为 executor 独立签发的公钥。
{{- if .Values.aiActionExecutor.realMutation }}
            - name: EXECUTOR_VERIFY_KEYS
              valueFrom:
                secretKeyRef:
                  name: aiops-secrets
                  key: AI_ACTION_EXECUTOR_VERIFY_KEYS
{{- end }}
          readinessProbe:
            httpGet:
              path: /healthz
              port: 8080
            initialDelaySeconds: 5
            periodSeconds: 10
---
apiVersion: v1
kind: Service
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
spec:
  selector:
    app: ai-action-executor
  ports:
    - port: 8080
      targetPort: 8080
      name: http
{{- if .Values.aiActionExecutor.realMutation }}
---
# Executor 专属 SA + 目标 namespace 白名单的 Deployment get/patch 权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-action-executor
  namespace: {{ .Release.Namespace }}
---
{{- range $targetNamespace := .Values.aiActionExecutor.targetNamespaces }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: ai-action-executor
  namespace: {{ $targetNamespace }}
rules:
  - apiGroups: ["apps"]
    resources: ["deployments"]
    verbs: ["get", "patch"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: ai-action-executor
  namespace: {{ $targetNamespace }}
subjects:
  - kind: ServiceAccount
    name: ai-action-executor
    namespace: {{ $.Release.Namespace }}
roleRef:
  kind: Role
  name: ai-action-executor
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
{{- end }}
