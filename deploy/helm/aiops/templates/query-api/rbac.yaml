{{- if .Values.queryApi.enabled }}
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-api-http
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api-http
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-run-dispatch
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-run-dispatch
---
apiVersion: v1
kind: ServiceAccount
metadata:
  name: query-alert-eval
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-alert-eval
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: query-api-http-view
  labels:
    app: query-api-http
subjects:
- kind: ServiceAccount
  name: query-api-http
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: ClusterRole
  name: view
  apiGroup: rbac.authorization.k8s.io
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: query-api-http-node-reader
  labels:
    app: query-api-http
rules:
- apiGroups: [""]
  resources: ["nodes"]
  verbs: ["get", "list", "watch"]
- apiGroups: ["metrics.k8s.io"]
  resources: ["nodes"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: query-api-http-node-reader
  labels:
    app: query-api-http
subjects:
- kind: ServiceAccount
  name: query-api-http
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: ClusterRole
  name: query-api-http-node-reader
  apiGroup: rbac.authorization.k8s.io
{{- if .Values.queryApi.localCredentialSecretName }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: Role
metadata:
  name: query-api-http-credential-reader
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api-http
rules:
- apiGroups: [""]
  resources: ["secrets"]
  resourceNames: [{{ .Values.queryApi.localCredentialSecretName | quote }}]
  verbs: ["get"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: RoleBinding
metadata:
  name: query-api-http-credential-reader
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api-http
subjects:
- kind: ServiceAccount
  name: query-api-http
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: Role
  name: query-api-http-credential-reader
  apiGroup: rbac.authorization.k8s.io
{{- end }}
{{- end }}
