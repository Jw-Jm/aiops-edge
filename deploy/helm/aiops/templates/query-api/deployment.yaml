{{- if .Values.queryApi.enabled }}
{{- $http := .Values.queryApi.http | default dict }}
{{- $runDispatch := .Values.queryApi.runDispatch | default dict }}
{{- $alertEval := .Values.queryApi.alertEval | default dict }}
{{- $httpReplicas := get $http "replicas" | default .Values.replicaCount }}
{{- $runDispatchReplicas := get $runDispatch "replicas" | default 1 }}
{{- $alertEvalReplicas := get $alertEval "replicas" | default 1 }}
{{- $httpResources := get $http "resources" | default .Values.queryApi.resources }}
{{- $runDispatchResources := get $runDispatch "resources" | default .Values.queryApi.resources }}
{{- $alertEvalResources := get $alertEval "resources" | default .Values.queryApi.resources }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api-http
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api-http
spec:
  replicas: {{ $httpReplicas }}
  selector:
    matchLabels:
      app: query-api-http
  template:
    metadata:
      labels:
        app: query-api-http
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: query-api-http
      containers:
        - name: query-api-http
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.queryApi.image .) "tag" .Values.global.imageTag) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/query-api-http"]
          ports:
            - containerPort: 8080
          env:
            {{- include "aiops.queryApiCommonEnv" . | nindent 12 }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            httpGet: { path: /readyz, port: 8080{{- if .Values.internalTLS.enabled }}, scheme: HTTPS{{- end }} }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /livez, port: 8080{{- if .Values.internalTLS.enabled }}, scheme: HTTPS{{- end }} }
            initialDelaySeconds: 20
          resources:
            {{- toYaml $httpResources | nindent 12 }}
      {{- if .Values.internalTLS.enabled }}
      volumes:
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-run-dispatch
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-run-dispatch
spec:
  replicas: {{ $runDispatchReplicas }}
  selector:
    matchLabels:
      app: query-run-dispatch
  template:
    metadata:
      labels:
        app: query-run-dispatch
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: query-run-dispatch
      containers:
        - name: query-run-dispatch
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.queryApi.image .) "tag" .Values.global.imageTag) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/query-run-dispatcher"]
          env:
            {{- include "aiops.queryApiCommonEnv" . | nindent 12 }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
          resources:
            {{- toYaml $runDispatchResources | nindent 12 }}
      {{- if .Values.internalTLS.enabled }}
      volumes:
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-alert-eval
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-alert-eval
spec:
  replicas: {{ $alertEvalReplicas }}
  selector:
    matchLabels:
      app: query-alert-eval
  template:
    metadata:
      labels:
        app: query-alert-eval
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: query-alert-eval
      containers:
        - name: query-alert-eval
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.queryApi.image .) "tag" .Values.global.imageTag) | quote }}
          imagePullPolicy: IfNotPresent
          command: ["/query-alert-evaluator"]
          env:
            {{- include "aiops.queryApiCommonEnv" . | nindent 12 }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
          readinessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 5
          livenessProbe:
            exec:
              command: ["sh", "-c", "kill -0 1"]
            initialDelaySeconds: 10
          resources:
            {{- toYaml $alertEvalResources | nindent 12 }}
      {{- if .Values.internalTLS.enabled }}
      volumes:
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api-http
spec:
  selector:
    app: query-api-http
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
