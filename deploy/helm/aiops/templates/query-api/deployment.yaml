{{- if .Values.queryApi.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: query-api
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: query-api
  template:
    metadata:
      labels:
        app: query-api
    spec:
      serviceAccountName: query-api
      containers:
        - name: query-api
          image: {{ tpl .Values.queryApi.image . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: CLICKHOUSE_HOST
              value: {{ .Values.queryApi.clickhouseHost | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.queryApi.clickhousePort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | default "default" | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
            - name: VICTORIA_METRICS_URL
              value: {{ .Values.queryApi.victoriaMetricsUrl | quote }}
            - name: VICTORIA_LOGS_URL
              value: {{ .Values.queryApi.victoriaLogsUrl }}/insert/jsonline
            - name: K8S_API_URL
              value: {{ .Values.queryApi.k8sApiUrl | quote }}
            - name: K8S_INSECURE_SKIP_VERIFY
              value: {{ .Values.queryApi.k8sInsecureSkipVerify | default "true" | quote }}
            - name: JWT_SECRET
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: JWT_SECRET }
            - name: LLM_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: LLM_ENCRYPTION_KEY }
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INTERNAL_TOKEN }
            - name: MYSQL_HOST
              value: {{ .Values.queryApi.mysqlHost | default "mysql" | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.queryApi.mysqlPort | default "3306" | quote }}
            - name: MYSQL_USER
              value: {{ .Values.queryApi.mysqlUser | default "root" | quote }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_ROOT_PASSWORD }
            - name: MYSQL_DB
              value: {{ .Values.queryApi.mysqlDb | default "aiops" | quote }}
            - name: ADMIN_INITIAL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: ADMIN_INITIAL_PASSWORD }
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.queryApi.resources | nindent 12 }}
---
apiVersion: v1
kind: Service
metadata:
  name: query-api
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: query-api
spec:
  selector:
    app: query-api
  ports:
    - port: 8080
      targetPort: 8080
{{- end }}
