{{- if .Values.aiOrchestrator.enabled }}
# ai-orchestrator/investigation-worker 专用 ServiceAccount + K8s read-only RBAC。
# investigation workers use a separate tokenless ServiceAccount and never
# inherit this Kubernetes identity.
# 所有 mutation 必须经 query-api → ai-action-executor；该身份永远不获写权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-orchestrator-ops
  labels:
    app: ai-orchestrator
rules:
# pod 只读（分析/证据采集必需）
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# drain 判定 workload 归属所需控制器只读
- apiGroups: ["apps"]
  resources: ["replicasets", "replicationcontrollers"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["replicationcontrollers", "events", "pods/log"]
  verbs: ["get", "list"]
{{- if .Values.aiOrchestrator.grantK8sWrite }}
# ── 受控演练写权限（P2-F2 RBAC toggle）──
# 默认关闭（values.yaml grantK8sWrite: false；values-prod 不覆盖 → 恒 false）。
# 仅限 observability workloads 的 deployments patch，是 grant-orchestrator-ops.sh
# 临时演练用开关；演练结束必须 revoke-orchestrator-ops.sh 撤销（置回 false）。
# production manifest 校验该段不得出现（见 test-image-digest-contracts / gate）。
- apiGroups: ["apps"]
  resources: ["deployments"]
  verbs: ["patch"]
{{- end }}
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-orchestrator-ops
  labels:
    app: ai-orchestrator
subjects:
- kind: ServiceAccount
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: ClusterRole
  name: ai-orchestrator-ops
  apiGroup: rbac.authorization.k8s.io
{{- end }}
