{{- if .Values.aiOrchestrator.enabled }}
# ai-orchestrator 专用 ServiceAccount + K8s read-only RBAC。
# 所有 mutation 必须经 query-api → ai-action-executor；该身份永远不获写权限。
apiVersion: v1
kind: ServiceAccount
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRole
metadata:
  name: ai-orchestrator-ops
  labels:
    app: ai-orchestrator
rules:
# pod 只读（分析/证据采集必需）
- apiGroups: [""]
  resources: ["pods"]
  verbs: ["get", "list", "watch"]
# drain 判定 workload 归属所需控制器只读
- apiGroups: ["apps"]
  resources: ["replicasets", "replicationcontrollers"]
  verbs: ["get", "list", "watch"]
- apiGroups: [""]
  resources: ["replicationcontrollers", "events", "pods/log"]
  verbs: ["get", "list"]
---
apiVersion: rbac.authorization.k8s.io/v1
kind: ClusterRoleBinding
metadata:
  name: ai-orchestrator-ops
  labels:
    app: ai-orchestrator
subjects:
- kind: ServiceAccount
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
roleRef:
  kind: ClusterRole
  name: ai-orchestrator-ops
  apiGroup: rbac.authorization.k8s.io
{{- end }}
