{{- if .Values.aiOrchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
spec:
  # 有状态单写组件（挂 RWO PVC orchestrator-data，含 ChromaDB/sqlite/checkpoint）：多副本会因
  # RWO 冲突 CrashLoopBackOff，固定 1 副本；生产可用 values-prod.yaml 的 orchestratorReplicas 覆盖
  # （多副本需先外部化存储）。
  replicas: {{ .Values.orchestratorReplicas | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      serviceAccountName: ai-orchestrator
      containers:
        - name: ai-orchestrator
          image: {{ tpl .Values.aiOrchestrator.image . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: QUERY_API_URL
              value: {{ .Values.aiOrchestrator.queryApiUrl | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INTERNAL_TOKEN }
            # V9.2 Service Identity (P3.5 infra). orchestrator signs orchestrator→query
            # contexts and (from P3.9) verifies query→orchestrator contexts.
            - name: TRUSTED_CONTEXT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: ORCHESTRATOR_TO_QUERY_SIGNING_KEY }
            - name: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS }
            - name: QUERY_TO_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_TOKEN }
            - name: CLICKHOUSE_HOST
              value: {{ .Values.aiOrchestrator.clickhouseHost | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.aiOrchestrator.clickhousePort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | default "default" | quote }}
            # P0-P13 审计紧急隔离（P0-3）：orchestrator 默认不注入 DB 直连凭据（仅经 query-api 访问）。
            # injectDbCredentials=true 才注入；默认 false（fail-closed）。
{{- if .Values.aiOrchestrator.injectDbCredentials }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
{{- end }}
            - name: LLM_MOCK
              value: {{ .Values.aiOrchestrator.llmMock | quote }}
            - name: AIOPS_DATA_DIR
              value: {{ .Values.aiOrchestrator.dataDir | default "/var/lib/aiops" | quote }}
            - name: MYSQL_HOST
              value: {{ .Values.mysql.serviceName | default "mysql" | quote }}
            - name: MYSQL_PORT
              value: {{ .Values.mysql.port | default 3306 | quote }}
            - name: MYSQL_USER
              value: {{ .Values.mysql.user | default "aiops_app" | quote }}
            # P0-P13 审计紧急隔离（P0-3）：默认不注入 MySQL 直连凭据（仅经 query-api 访问）。
            # injectDbCredentials=true 才注入；默认 false（fail-closed）。
{{- if .Values.aiOrchestrator.injectDbCredentials }}
            - name: MYSQL_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: MYSQL_APP_PASSWORD }
{{- end }}
            - name: MYSQL_DB
              value: {{ .Values.mysql.database | default "aiops" | quote }}
            - name: KG_BUILD_INTERVAL_SECONDS
              value: {{ .Values.aiOrchestrator.kgBuildIntervalSeconds | default 60 | quote }}
          startupProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.aiOrchestrator.resources | nindent 12 }}
          volumeMounts:
            # 统一数据目录: ChromaDB 案例库 + LangGraph session, 由 AIOPS_DATA_DIR 指向 (默认 /var/lib/aiops)
            - name: data
              mountPath: /var/lib/aiops
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orchestrator-data
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
spec:
  selector:
    app: ai-orchestrator
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchestrator-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.aiOrchestrator.dataStorageClass }}
  storageClassName: {{ .Values.aiOrchestrator.dataStorageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.aiOrchestrator.dataStorage }}
{{- end }}
