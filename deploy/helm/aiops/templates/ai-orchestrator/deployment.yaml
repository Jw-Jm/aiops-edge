{{- if .Values.aiOrchestrator.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
spec:
  # 有状态单写组件（挂 RWO PVC orchestrator-data，含 ChromaDB/sqlite/checkpoint）：多副本会因
  # RWO 冲突 CrashLoopBackOff，固定 1 副本；生产可用 values-prod.yaml 的 orchestratorReplicas 覆盖
  # （多副本需先外部化存储）。
  replicas: {{ .Values.orchestratorReplicas | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: ai-orchestrator
  template:
    metadata:
      labels:
        app: ai-orchestrator
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: ai-orchestrator
      # The gateway performs a production fail-fast persistence probe while
      # importing the application. Wait for query-api readiness first so a
      # normal rollout does not create avoidable CrashLoopBackOff restarts;
      # query-api remains the availability authority and the wait is fail-closed.
      initContainers:
        - name: wait-for-query-api
          image: {{ tpl .Values.aiOrchestrator.image . }}
          imagePullPolicy: IfNotPresent
          command: ["sh", "-c"]
          args:
            - >-
              until curl --fail --silent --show-error --connect-timeout 2 --max-time 5
              {{- if .Values.internalTLS.enabled }} --cacert {{ .Values.internalTLS.clientCAFile }}{{- end }}
              {{ trimSuffix "/api/v1" .Values.aiOrchestrator.queryApiUrl }}/readyz;
              do echo "waiting for query-api readiness"; sleep 2; done
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          {{- end }}
      containers:
        - name: ai-orchestrator
          image: {{ tpl .Values.aiOrchestrator.image . }}
          imagePullPolicy: IfNotPresent
          {{- if .Values.internalTLS.enabled }}
          command: ["python", "-m", "mtls_server"]
          args: ["main:app", "--host", "0.0.0.0", "--port", "8080", "--timeout-keep-alive", "120", "--limit-concurrency", "20", "--ssl-keyfile", "{{ .Values.internalTLS.keyFile }}", "--ssl-certfile", "{{ .Values.internalTLS.certFile }}", "--ssl-ca-certs", "{{ .Values.internalTLS.clientCAFile }}", "--ssl-cert-reqs", "2"]
          {{- end }}
          ports:
            - containerPort: 8080
          env:
            - name: AIOPS_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            - name: QUERY_API_URL
              value: {{ .Values.aiOrchestrator.queryApiUrl | quote }}
            - name: INTERNAL_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INTERNAL_TOKEN }
            # V9.2 Service Identity (P3.5 infra). orchestrator signs orchestrator→query
            # contexts and (from P3.9) verifies query→orchestrator contexts.
            - name: TRUSTED_CONTEXT_PRIVATE_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: ORCHESTRATOR_TO_QUERY_SIGNING_KEY }
            - name: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_VERIFY_KEYS }
            - name: QUERY_TO_ORCHESTRATOR_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: QUERY_TO_ORCHESTRATOR_TOKEN }
            - name: AIOPS_DEPLOYMENT_MODE
              value: "production"
            - name: AIOPS_SYSTEM_TENANT_ID
              value: {{ .Values.aiOrchestrator.systemTenantId | quote }}
            - name: AIOPS_SYSTEM_CLUSTER_ID
              value: {{ .Values.aiOrchestrator.systemClusterId | quote }}
            # C2-5：Orchestrator receives no MySQL/ClickHouse credentials;
            # all data access goes through query-api.
            - name: INVESTIGATION_RUNTIME_ENABLED
              value: {{ .Values.aiOrchestrator.investigationRuntimeEnabled | quote }}
            - name: LEGACY_FLOW_RUNTIME_ENABLED
              value: {{ .Values.aiOrchestrator.legacyFlowRuntimeEnabled | quote }}
            - name: INVESTIGATOR_ENABLED
              value: {{ .Values.aiOrchestrator.investigatorEnabled | quote }}
            - name: LEGACY_DIRECT_MUTATIONS_ENABLED
              value: {{ .Values.aiOrchestrator.legacyDirectMutationsEnabled | quote }}
            - name: LLM_MOCK
              value: {{ .Values.aiOrchestrator.llmMock | quote }}
            {{- include "aiops.mtlsEnv" . | nindent 12 }}
{{- if .Values.llmEgressProxy.enabled }}
            # C-04：启用代理时，orchestrator 只拿代理地址和代理 token；Provider key 只在 proxy。
            - name: LLM_PROXY_URL
              value: {{ printf "%s://ai-llm-egress-proxy.%s.svc.cluster.local:8080" (include "aiops.internalScheme" .) .Values.namespace.observability | quote }}
            - name: LLM_PROXY_TOKEN
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: LLM_PROXY_TOKEN }
{{- else }}
            - name: LLM_PROXY_URL
              value: ""
            - name: LLM_PROXY_TOKEN
              value: ""
{{- end }}
            - name: AIOPS_DATA_DIR
              value: {{ .Values.aiOrchestrator.dataDir | default "/var/lib/aiops" | quote }}
            - name: KG_BUILD_INTERVAL_SECONDS
              value: {{ .Values.aiOrchestrator.kgBuildIntervalSeconds | default 60 | quote }}
          startupProbe:
            {{- if .Values.internalTLS.enabled }}
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert {{ .Values.internalTLS.clientCAFile }}
                  --cert {{ .Values.internalTLS.certFile }} --key {{ .Values.internalTLS.keyFile }}
                  https://127.0.0.1:8080/health
            {{- else }}
            httpGet: { path: /health, port: 8080 }
            {{- end }}
            initialDelaySeconds: 10
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 12
          readinessProbe:
            {{- if .Values.internalTLS.enabled }}
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert {{ .Values.internalTLS.clientCAFile }}
                  --cert {{ .Values.internalTLS.certFile }} --key {{ .Values.internalTLS.keyFile }}
                  https://127.0.0.1:8080/readyz
            {{- else }}
            httpGet: { path: /readyz, port: 8080 }
            {{- end }}
            periodSeconds: 15
            timeoutSeconds: 10
            failureThreshold: 3
          livenessProbe:
            {{- if .Values.internalTLS.enabled }}
            exec:
              command:
                - sh
                - -c
                - >-
                  curl --fail --silent --show-error --cacert {{ .Values.internalTLS.clientCAFile }}
                  --cert {{ .Values.internalTLS.certFile }} --key {{ .Values.internalTLS.keyFile }}
                  https://127.0.0.1:8080/health
            {{- else }}
            httpGet: { path: /health, port: 8080 }
            {{- end }}
            periodSeconds: 30
            timeoutSeconds: 10
            failureThreshold: 5
          resources:
            {{- toYaml .Values.aiOrchestrator.resources | nindent 12 }}
          volumeMounts:
            # 统一数据目录: ChromaDB 案例库 + LangGraph session, 由 AIOPS_DATA_DIR 指向 (默认 /var/lib/aiops)
            - name: data
              mountPath: /var/lib/aiops
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: orchestrator-data
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
---
apiVersion: v1
kind: Service
metadata:
  name: ai-orchestrator
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ai-orchestrator
spec:
  selector:
    app: ai-orchestrator
  ports:
    - port: 8080
      targetPort: 8080
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: orchestrator-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.aiOrchestrator.dataStorageClass }}
  storageClassName: {{ .Values.aiOrchestrator.dataStorageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.aiOrchestrator.dataStorage }}
{{- end }}
