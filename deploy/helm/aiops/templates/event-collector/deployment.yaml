{{- if .Values.eventCollector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: event-collector
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: event-collector
spec:
  selector:
    matchLabels:
      app: event-collector
  template:
    metadata:
      labels:
        app: event-collector
    spec:
      serviceAccountName: event-collector
      # G5 加固：移除 `tolerations: operator: Exists`（容忍所有污点）。
      # 默认不调度到被污点节点；如确需在特定污点节点采集 SEL，请显式添加受限 tolerations。
      containers:
        - name: event-collector
          image: {{ tpl .Values.eventCollector.image . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            # 租户/集群 ID（Phase 5：必须 canonical UUID，缺失/非法将 fail-closed 拒绝启动；
            # 部署侧需注入注册后的集群 canonical UUID，而非 default/slug）
            - name: TENANT_ID
              value: {{ .Values.eventCollector.tenantId | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.eventCollector.clusterId | default "default" | quote }}
            # WAL 持久化（Phase 5）：写入 CH 前落盘，崩溃/重启恢复未确认批次
            - name: WAL_DIR
              value: "/var/lib/aiops/wal"
            # DaemonSet 用于每节点 SEL 采集（天然按节点隔离，无跨节点竞争）。
            # cluster-wide Kubernetes Event watch 使用 coordination.k8s.io/v1 Lease 进行
            # leader election：同一时刻仅 Lease holder 启动集群级 watch，其余副本只做 SEL。
            # dedup / ReplacingMergeTree 仅作为 replay/reconnect/leader 转换的防重保护，
            # 不得作为多 active writer 的正常运行机制（V9.2 §71 single leader）。
            - name: K8S_WATCH_ENABLED
              value: {{ .Values.eventCollector.k8sWatchEnabled | default "true" | quote }}
            # Leader election（默认启用）。DaemonSet 多副本时仅 Lease holder watch 集群事件。
            - name: LEADER_ELECTION_ENABLED
              value: {{ .Values.eventCollector.leaderElectionEnabled | default "true" | quote }}
            - name: LEASE_NAME
              value: {{ .Values.eventCollector.leaseName | default "aiops-event-collector-leader" | quote }}
            - name: LEASE_NAMESPACE
              value: {{ .Values.namespace.observability | quote }}
            # IPMI SEL 采集：本地 KCS（/dev/ipmi0）每节点采集；无 BMC 节点自动跳过
            - name: SEL_COLLECT_ENABLED
              value: {{ .Values.eventCollector.selCollectEnabled | default "true" | quote }}
            - name: SEL_LOCAL_ONLY
              value: "true"
            - name: SEL_INTERVAL_SECONDS
              value: {{ .Values.eventCollector.selIntervalSeconds | default 120 | quote }}
            # ClickHouse（事件落库）
            - name: CLICKHOUSE_HOST
              value: {{ .Values.eventCollector.clickhouseHost | default "clickhouse" | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.eventCollector.clickhousePort | default 8123 | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | default "default" | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
          securityContext:
            # G5 加固：移除 privileged:true。IPMI KCS 本地读 /dev/ipmi0 需要原始 I/O，
            # 改用最小 capability SYS_RAWIO（hostPath 设备挂载见下方 volumes）；
            # 若运行环境不支持 capability 访问 /dev/ipmi0，可改用 device plugin 暴露设备。
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
              add: ["SYS_RAWIO"]
          volumeMounts:
            # IPMI 本地 KCS 接口（无 /dev/ipmi0 的节点组件自动跳过 SEL 采集）
            - name: dev-ipmi
              mountPath: /dev/ipmi0
            # WAL 持久化目录（hostPath：每节点本地，供崩溃恢复；仅 leader 写其节点 WAL）
            - name: wal
              mountPath: /var/lib/aiops/wal
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.eventCollector.resources | nindent 12 }}
      volumes:
        - name: dev-ipmi
          hostPath:
            path: /dev/ipmi0
        - name: wal
          hostPath:
            path: /var/lib/aiops/event-collector-wal
            type: DirectoryOrCreate
{{- end }}
