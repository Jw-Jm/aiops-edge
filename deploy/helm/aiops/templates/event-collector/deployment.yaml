{{- if .Values.eventCollector.enabled }}
apiVersion: apps/v1
kind: DaemonSet
metadata:
  name: event-collector
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: event-collector
spec:
  selector:
    matchLabels:
      app: event-collector
  template:
    metadata:
      labels:
        app: event-collector
    spec:
      {{- include "aiops.mtlsPodSecurityContext" . | nindent 6 }}
      serviceAccountName: event-collector
      # G5 加固：移除 `tolerations: operator: Exists`（容忍所有污点）。
      # 默认不调度到被污点节点；如确需在特定污点节点采集 SEL，请显式添加受限 tolerations。
      containers:
        - name: event-collector
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.eventCollector.image .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.eventCollector | default "") "env" (.Values.global.environment | default "")) | quote }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
          env:
            - name: AIOPS_ENV
              value: {{ .Values.global.environment | default "production" | quote }}
            # 租户/集群 ID（Phase 5：必须 canonical UUID，缺失/非法将 fail-closed 拒绝启动；
            # 部署侧需注入注册后的集群 canonical UUID，而非 default/slug）
            - name: TENANT_ID
              value: {{ .Values.eventCollector.tenantId | quote }}
            - name: CLUSTER_ID
              value: {{ .Values.eventCollector.clusterId | quote }}
            # WAL 持久化（Phase 5）：写入 CH 前落盘，崩溃/重启恢复未确认批次
            - name: WAL_DIR
              value: "/var/lib/aiops/wal"
            # DaemonSet 用于每节点 SEL 采集（天然按节点隔离，无跨节点竞争）。
            # cluster-wide Kubernetes Event watch 使用 coordination.k8s.io/v1 Lease 进行
            # leader election：同一时刻仅 Lease holder 启动集群级 watch，其余副本只做 SEL。
            # dedup / ReplacingMergeTree 仅作为 replay/reconnect/leader 转换的防重保护，
            # 不得作为多 active writer 的正常运行机制（V9.2 §71 single leader）。
            - name: K8S_WATCH_ENABLED
              value: {{ .Values.eventCollector.k8sWatchEnabled | default "true" | quote }}
            # Leader election（默认启用）。DaemonSet 多副本时仅 Lease holder watch 集群事件。
            - name: LEADER_ELECTION_ENABLED
              value: {{ .Values.eventCollector.leaderElectionEnabled | default "true" | quote }}
            - name: LEASE_NAME
              value: {{ .Values.eventCollector.leaseName | default "aiops-event-collector-leader" | quote }}
            - name: LEASE_NAMESPACE
              value: {{ .Values.namespace.observability | quote }}
            # IPMI SEL 采集：生产默认关闭 in-band KCS；启用时仅用于明确的本地验证。
            - name: SEL_COLLECT_ENABLED
              value: {{ .Values.eventCollector.selCollectEnabled | quote }}
            - name: SEL_LOCAL_ONLY
              value: "true"
            - name: SEL_INTERVAL_SECONDS
              value: {{ .Values.eventCollector.selIntervalSeconds | default 120 | quote }}
            # Unified Ingest（collector 不持有 ClickHouse 凭据）
            - name: INGEST_URL
              value: {{ .Values.eventCollector.ingestURL | default "http://ingest:8080" | quote }}
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INGEST_API_KEY }
            {{- include "aiops.mtlsEnv" . | nindent 12 }}
          securityContext:
            # G5：无特权、无能力、禁止提权；硬件采集仅在显式本地验证 profile
            # 中通过设备插件启用，生产 profile 保持关闭。
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: true
            capabilities:
              drop: ["ALL"]
{{ if .Values.eventCollector.selCollectEnabled }}
              add: ["SYS_RAWIO"]
{{ end }}
            seccompProfile:
              type: RuntimeDefault
          volumeMounts:
{{ if .Values.eventCollector.selCollectEnabled }}
            # IPMI 本地 KCS 接口（仅显式本地验证 profile）
            - name: dev-ipmi
              mountPath: /dev/ipmi0
{{ end }}
            # WAL 持久化目录（hostPath：每节点本地，供崩溃恢复；仅 leader 写其节点 WAL）
            - name: wal
              mountPath: /var/lib/aiops/wal
            {{- include "aiops.mtlsVolumeMount" . | nindent 12 }}
          readinessProbe:
            httpGet: { path: /health, port: 8080{{- if .Values.internalTLS.enabled }}, scheme: HTTPS{{- end }} }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080{{- if .Values.internalTLS.enabled }}, scheme: HTTPS{{- end }} }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.eventCollector.resources | nindent 12 }}
      volumes:
{{- if .Values.eventCollector.selCollectEnabled }}
        - name: dev-ipmi
          hostPath:
            path: /dev/ipmi0
{{- end }}
        - name: wal
          hostPath:
            path: /var/lib/aiops/event-collector-wal
            type: DirectoryOrCreate
        {{- include "aiops.mtlsVolume" . | nindent 8 }}
{{- end }}
