{{- if .Values.victoriaLogs.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: victoria-logs
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-logs
spec:
  # 单写有状态组件固定 1 副本（共享 RWO PVC 不能扩副本，避免挂载失败/数据损坏）。
  replicas: {{ .Values.statefulReplicaCount | default 1 }}
  selector:
    matchLabels:
      app: victoria-logs
  template:
    metadata:
      labels:
        app: victoria-logs
    spec:
      containers:
        - name: victoria-logs
          image: {{ .Values.victoriaLogs.image }}
          args:
            - "-storageDataPath=/vlogsdata"
            - "-retentionPeriod=30d"
          ports:
            - containerPort: 9428
              name: http
          readinessProbe:
            httpGet: { path: /health, port: 9428 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 9428 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.victoriaLogs.resources | nindent 12 }}
          volumeMounts:
            - name: data
              mountPath: /vlogsdata
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: vlogs-data
---
apiVersion: v1
kind: Service
metadata:
  name: victoria-logs
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: victoria-logs
spec:
  selector:
    app: victoria-logs
  ports:
    - port: 9428
      targetPort: 9428
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: vlogs-data
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.victoriaLogs.storageClass }}
  storageClassName: {{ .Values.victoriaLogs.storageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.victoriaLogs.storage }}
{{- end }}
