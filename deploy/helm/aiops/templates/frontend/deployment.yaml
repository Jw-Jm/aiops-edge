{{- if .Values.frontend.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: frontend
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: frontend
spec:
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: frontend
  template:
    metadata:
      labels:
        app: frontend
    spec:
      containers:
        - name: frontend
          securityContext:
            allowPrivilegeEscalation: false
            readOnlyRootFilesystem: false
            capabilities:
              drop:
                - ALL
            seccompProfile:
              type: RuntimeDefault
          image: {{ include "aiops.imageWithGlobalTag" (dict "image" (tpl .Values.frontend.image .) "tag" .Values.global.imageTag "digest" (.Values.global.imageDigests.frontend | default "") "env" (.Values.global.environment | default "")) | quote }}
          imagePullPolicy: IfNotPresent
          env:
            - name: DEEPFLOW_ENABLED
              value: {{ .Values.deepflow.enabled | quote }}
            - name: AIOPS_INTERNAL_TLS_ENABLED
              value: {{ .Values.internalTLS.enabled | quote }}
          {{- if .Values.internalTLS.enabled }}
          volumeMounts:
            - name: internal-tls-ca
              mountPath: /etc/nginx/tls
              readOnly: true
          {{- end }}
          ports:
            - containerPort: 80
          readinessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 5
          livenessProbe:
            httpGet: { path: /, port: 80 }
            initialDelaySeconds: 15
          resources:
            {{- toYaml .Values.frontend.resources | nindent 12 }}
      {{- if .Values.internalTLS.enabled }}
      volumes:
        - name: internal-tls-ca
          secret:
            secretName: {{ .Values.internalTLS.secretName }}
            defaultMode: 0440
            items:
              - key: ca.crt
                path: ca.crt
      {{- end }}
---
apiVersion: v1
kind: Service
metadata:
  name: frontend
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: frontend
spec:
  type: NodePort
  selector:
    app: frontend
  ports:
    - port: 80
      targetPort: 80
      nodePort: {{ .Values.frontend.nodePort }}
{{- end }}
