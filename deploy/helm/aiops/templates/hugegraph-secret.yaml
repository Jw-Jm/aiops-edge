{{- if .Values.hugeGraph.enabled }}
apiVersion: v1
kind: Secret
metadata:
  name: hugegraph-auth
  namespace: {{ .Values.namespace.observability }}
type: Opaque
stringData:
  username: {{ .Values.hugeGraph.username | default "admin" | quote }}
  password: {{ include "aiops.requireSecret" (dict "name" "secrets.hugeGraphPassword" "value" .Values.secrets.hugeGraphPassword) | quote }}
{{- end }}
