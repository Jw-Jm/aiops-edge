{{- if .Values.ingest.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: ingest
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ingest
spec:
  # 有状态单写组件（挂 RWO PVC ingest-wal，记录采集进度）：多副本会因 RWO 冲突 CrashLoopBackOff，
  # 固定 1 副本；生产可用 values-prod.yaml 的 ingestReplicas 覆盖（多副本需先外部化存储）。
  replicas: {{ .Values.ingestReplicas | default .Values.replicaCount }}
  selector:
    matchLabels:
      app: ingest
  template:
    metadata:
      labels:
        app: ingest
    spec:
      containers:
        - name: ingest
          image: {{ tpl .Values.ingest.image . }}
          imagePullPolicy: IfNotPresent
          ports:
            - containerPort: 8080
            {{- if .Values.ingest.otlpGrpcEnabled }}
            - containerPort: {{ .Values.ingest.otlpGrpcPort | default 4317 }}
              name: otlp-grpc
            {{- end }}
          env:
            - name: CLICKHOUSE_HOST
              value: {{ .Values.ingest.clickhouseHost | quote }}
            - name: CLICKHOUSE_PORT
              value: {{ .Values.ingest.clickhousePort | quote }}
            # C-01：Trace Persistent SoT 使用 ClickHouse HTTP 接口；仅注入
            # CLICKHOUSE_HOST/PORT 不会被 ingest 的 span sink 读取，必须显式组装 URL。
            - name: CLICKHOUSE_HTTP_URL
              value: {{ printf "http://%s:%s" .Values.ingest.clickhouseHost .Values.ingest.clickhousePort | quote }}
            - name: CLICKHOUSE_USER
              value: {{ .Values.clickhouse.user | default "default" | quote }}
            - name: CLICKHOUSE_PASSWORD
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: CLICKHOUSE_PASSWORD }
            # DeepFlow 同步：host 为空则禁用同步器
            - name: DEEPFLOW_CH_HOST
              value: {{ .Values.ingest.deepflowChHost | quote }}
            - name: DEEPFLOW_CH_PORT
              value: {{ .Values.ingest.deepflowChPort | quote }}
            - name: DEEPFLOW_TENANT_ID
              value: {{ .Values.ingest.deepflowTenantId | default "default" | quote }}
            - name: DEEPFLOW_SYNC_INTERVAL
              value: {{ .Values.ingest.syncInterval | quote }}
            - name: DEEPFLOW_SPAN_SAMPLE_RATE
              value: {{ .Values.ingest.spanSampleRate | default 1.0 | quote }}
            - name: INGEST_WAL_DIR
              value: "/wal"
            # 多集群纳管：本 ingest 实例所属集群 ID（代码默认 "default"，主集群显式注入保持一致）
            - name: CLUSTER_ID
              value: {{ .Values.ingest.clusterId | default "default" | quote }}
            # V9.3 Phase 14（P14.5）：legacy ClickHouse writer 已删除，不再注入 LEGACY_WRITER_ENABLED。
            # telemetry new backend：TELEMETRY_WRITER_MODE=new 启用写链（VM/VLogs）。空值/非法
            # → NewRuntimeFromEnv fail-closed 拒绝启动；new 未启用时 main 亦拒绝启动（无写路径）。
            # VICTORIA_*_URL 必须为 base URL（不带 /insert/jsonline，writer 内部追加）。
            - name: TELEMETRY_WRITER_MODE
              value: {{ .Values.ingest.telemetryWriterMode | default "new" | quote }}
            - name: VICTORIA_METRICS_URL
              value: {{ .Values.ingest.victoriaMetricsUrl | default "" | quote }}
            - name: VICTORIA_LOGS_URL
              value: {{ .Values.ingest.victoriaLogsUrl | default "" | quote }}
            # Candidate/production 必须在 Trace SoT 未配置时 fail-closed，不能
            # 以健康状态接收并丢弃 Trace；本地验证同样使用 required 以保持语义一致。
            - name: TRACE_SOT_MODE
              value: {{ .Values.ingest.traceSotMode | default "required" | quote }}
            - name: INGEST_API_KEY
              valueFrom:
                secretKeyRef: { name: aiops-secrets, key: INGEST_API_KEY }
            - name: OTLP_GRPC_ENABLED
              value: {{ .Values.ingest.otlpGrpcEnabled | default true | quote }}
            - name: OTLP_GRPC_PORT
              value: {{ .Values.ingest.otlpGrpcPort | default 4317 | quote }}
          readinessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 10
          livenessProbe:
            httpGet: { path: /health, port: 8080 }
            initialDelaySeconds: 20
          resources:
            {{- toYaml .Values.ingest.resources | nindent 12 }}
          volumeMounts:
            - name: wal
              mountPath: /wal
      volumes:
        - name: wal
          persistentVolumeClaim:
            claimName: ingest-wal
---
apiVersion: v1
kind: Service
metadata:
  name: ingest
  namespace: {{ .Values.namespace.observability }}
  labels:
    app: ingest
spec:
  selector:
    app: ingest
  ports:
    - port: 8080
      targetPort: 8080
    {{- if .Values.ingest.otlpGrpcEnabled }}
    - name: otlp-grpc
      port: {{ .Values.ingest.otlpGrpcPort | default 4317 }}
      targetPort: otlp-grpc
    {{- end }}
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: ingest-wal
  namespace: {{ .Values.namespace.observability }}
spec:
  accessModes: ["ReadWriteOnce"]
  {{- if .Values.ingest.walStorageClass }}
  storageClassName: {{ .Values.ingest.walStorageClass }}
  {{- end }}
  resources:
    requests:
      storage: {{ .Values.ingest.walStorage }}
{{- end }}
