{{- if .Values.vmagent.enabled }}
# vmagent scrape 配置 — 抓 node-exporter(OS) + ingest(服务RED) + orchestrator
# query-api 的 /metrics 为鉴权端点(401)，不作为 scrape 目标；ipmi-exporter 走 orchestrator 上报
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: {{ .Release.Namespace }}
data:
  scrape.yml: |
    global:
      scrape_interval: {{ .Values.vmagent.scrapeInterval }}
    scrape_configs:
      - job_name: node-exporter
        static_configs:
          - targets: ['{{ .Values.nodeExporterTarget }}:9100']
            labels:
              job: node-exporter
      - job_name: ingest
        static_configs:
          - targets: ['ingest:{{ .Values.ingestPort }}']
            labels:
              job: ingest
      - job_name: orchestrator
        static_configs:
          - targets: ['ai-orchestrator:{{ .Values.orchestratorPort }}']
            labels:
              job: orchestrator
{{- end }}
