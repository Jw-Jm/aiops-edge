{{- if .Values.vmagent.enabled }}
# vmagent scrape 配置 — 仅抓 node-exporter（ipmi-exporter 走 orchestrator 上报、ingest 无 prometheus 端点，均不作为目标）
apiVersion: v1
kind: ConfigMap
metadata:
  name: vmagent-config
  namespace: {{ .Release.Namespace }}
data:
  scrape.yml: |
    global:
      scrape_interval: {{ .Values.vmagent.scrapeInterval }}
    scrape_configs:
      - job_name: node-exporter
        static_configs:
          - targets: ['{{ .Values.nodeExporterTarget }}:9100']
            labels:
              job: node-exporter
{{- end }}
