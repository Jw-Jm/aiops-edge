{{- if .Values.vmagent.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: vmagent
  namespace: {{ .Release.Namespace }}
  labels:
    app.kubernetes.io/name: vmagent
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: vmagent
  template:
    metadata:
      labels:
        app.kubernetes.io/name: vmagent
    spec:
      containers:
        - name: vmagent
          image: {{ .Values.vmagent.image }}
          imagePullPolicy: IfNotPresent
          args:
            - -promscrape.config=/etc/vmagent/scrape.yml
            - -remoteWrite.url={{ .Values.vmagent.remoteWriteUrl }}
            - -httpListenAddr=:8429
          ports:
            - name: http
              containerPort: 8429
          volumeMounts:
            - name: config
              mountPath: /etc/vmagent
      volumes:
        - name: config
          configMap:
            name: vmagent-config
{{- end }}
