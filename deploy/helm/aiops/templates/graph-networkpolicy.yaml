{{- if and .Values.networkPolicy.enabled .Values.hugeGraph.enabled }}
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-query-api-to-hugegraph
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: hugegraph
  policyTypes: ["Ingress"]
  ingress:
    - from:
        - podSelector:
            matchLabels:
              app: query-api-http
        - podSelector:
            matchLabels:
              app: graph-schema-migrator
      ports:
        - protocol: TCP
          port: 8080
{{- if .Values.networkPolicy.egressDefaultDeny }}
---
# Query API and the schema migrator are the only callers of HugeGraph. The
# migrator also reads the MySQL canonical projection while applying schema.
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-query-api-to-hugegraph-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: query-api-http
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: hugegraph
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
---
apiVersion: networking.k8s.io/v1
kind: NetworkPolicy
metadata:
  name: allow-graph-schema-migrator-egress
  namespace: {{ .Values.namespace.observability }}
spec:
  podSelector:
    matchLabels:
      app: graph-schema-migrator
  policyTypes: ["Egress"]
  egress:
    - to:
        - podSelector:
            matchLabels:
              app: hugegraph
      ports:
        - protocol: TCP
          port: 8080
    - to:
        - podSelector:
            matchLabels:
              app: mysql
      ports:
        - protocol: TCP
          port: 3306
    - to:
        - namespaceSelector:
            matchLabels:
              kubernetes.io/metadata.name: kube-system
          podSelector:
            matchLabels:
              k8s-app: kube-dns
      ports:
        - protocol: UDP
          port: 53
        - protocol: TCP
          port: 53
{{- end }}
{{- end }}
