# =============================================================================
# AIOps 生产标准 overrides
# 用于正式生产环境部署时叠加：helm upgrade --install aiops . -f values-prod.yaml
# 说明：本机(OrbStack)默认 values.yaml 已是"除副本数=1 外按生产标准"。
#       部署到正式环境时，按需覆盖以下项。
#
# 重要：文件内所有 CHANGE_ME 为占位符，部署前必须替换为强随机值；
#       query-api 因缺失 JWT_SECRET / LLM_ENCRYPTION_KEY 会拒绝启动（安全兜底）。
# =============================================================================

# 无状态服务副本数。2026-09-04 业务决策：所有自研中心服务统一单副本，不要求服务级 HA
#（见 docs/runtime-slo.md；ARCH-701 Helm 渲染契约强制自研中心 Deployment spec.replicas==1）。
# 注意：ingest（挂 RWO WAL PVC）与 ai-orchestrator（挂 RWO 数据 PVC，含 ChromaDB/sqlite/checkpoint）
#       为有状态单写组件，多副本必然因 RWO PVC 冲突 CrashLoopBackOff，当前固定 1 副本
#       （见下方 orchestratorReplicas / ingestReplicas 覆盖项；若需多副本必须先外部化存储）。
# 有状态中间件（mysql/clickhouse）固定用 statefulReplicaCount=1，不受此值影响。
replicaCount: 1

# Release identity.  The frontend, Query API, schema-migrator, and Event
# Collector images built for this v3 acceptance are pinned to local OCI
# manifest digests; the remaining enabled self-owned images retain the
# already verified digests from the running release until their own source
# changes are rebuilt.
global:
  imageTag: "v3-20260910"
  imageDigests:
    queryApi: "sha256:4d57fee3d2e4bbb84d1990f0617e24c2530a2d9412f6270a54ccd4b31763fc70"
    ingest: "sha256:a5cfebe760a80212435ee0c7ee838f4bd9951d711393617b71ecd5828b1226b3"
    eventCollector: "sha256:b14a288d6cba44d1a2d1e29dc54e2e4a3f088773a5d5df94677f8061151336c1"
    aiOrchestrator: "sha256:e864af8ae0f0a2c94cca912746ad1b7775e0e0ad32cebce05d833e598d6b9aeb"
    investigationWorker: "sha256:e864af8ae0f0a2c94cca912746ad1b7775e0e0ad32cebce05d833e598d6b9aeb"
    frontend: "sha256:bd4a76fe8370b078b0ab3b37ab396c75945e726721500ffd7439126ca5fa3c84"
    aiActionExecutor: "sha256:071e456f7ad95ab2f28a0d5e30b1fbfd16000834afee0cf4c3c5194739af6c51"
    llmEgressProxy: "sha256:07840eff2f85c5eef0da7376575a2b6015e706a66b0a5d0edea1c0e62522065b"
    clickhouseMigrator: "sha256:6a201403ed1a8cc86402cec5d47937bdf3f62daecc78d6f9190d89153f4e7949"
    mysqlMigrator: "sha256:31d956fc5b39bfe319c28493358b67112c1f84d07d0ede1601fcd117f7fb3fa9"
    graphSchemaMigrator: "sha256:3cbf2b0e3e286dc6ca8cbb19f0de5d1b6bdf414fef4cc40d97d086ad00232cce"

internalTLS:
  enabled: true
  required: true
  secretName: aiops-internal-tls
  # SANs are the service identities covered by the production mTLS
  # certificate for this cluster; certificate material remains external.
  clientSAN: "query-api.observability.svc.cluster.local,query-run-dispatch.observability.svc.cluster.local,query-alert-eval.observability.svc.cluster.local,ai-orchestrator.observability.svc.cluster.local,ai-investigation-worker.observability.svc.cluster.local,ai-llm-egress-proxy.observability.svc.cluster.local,ingest.observability.svc.cluster.local,event-collector.observability.svc.cluster.local,ai-action-executor.observability.svc.cluster.local,credential-broker.observability.svc.cluster.local"

# 有状态单写组件固定 1 副本（RWO PVC 不可多副本；多副本需先外部化存储再调大）。
orchestratorReplicas: 1
ingestReplicas: 1

# 存储类：正式环境指定真实 SC（如云盘/企业 NFS），覆盖默认 ""
clickhouse:
  storageClass: "standard"
victoriaMetrics:
  storageClass: "standard"
victoriaLogs:
  storageClass: "standard"
chromadb:
  storageClass: "standard"
mysql:
  storageClass: "standard"
hugeGraph:
  enabled: true
  storageClass: "standard"

graph:
  # Production uses HugeGraph only after the graph schema/source reconciliation
  # gate; there is no silent legacy_mysql fallback in the release profile.
  backend: hugegraph

# 备份 PVC（backup-pvc，mysql/clickhouse 每日备份落地盘）
backup:
  storageClass: "standard"

# LLM 接真实模型（关闭 mock）
aiOrchestrator:
  llmMock: "false"
  investigationRuntimeEnabled: "0"
  queryApiUrl: "https://query-api.observability.svc.cluster.local:8080/api/v1"

# Production mutation is opt-in only after the broker profiles and RBAC have
# been provisioned. Keep disabled until CREDENTIAL_PROFILES is reviewed.
credentialBroker:
  enabled: false
  token: ""
  profiles: ""

eventCollector:
  # Production uses out-of-band BMC/Redfish collection. In-band /dev/ipmi0
  # access is restricted to the explicit local-validation profile.
  selCollectEnabled: false
  ingestURL: "https://ingest.observability.svc.cluster.local:8080"

investigationWorker:
  enabled: true
  # 2026-09-04 业务决策：自研中心服务统一单副本，不要求服务级 HA。
  replicas: 1

# 生产 LLM 出站唯一经 egress proxy，Provider key 只注入 proxy Secret。
llmEgressProxy:
  enabled: true

# ── Egress 默认拒绝（生产基线）──────────────────────────────────────────
# 生产所有 Pod 默认禁止出站，仅允许 networkpolicy.yaml 中按角色声明的
# MySQL/观测存储/Kubernetes API/内部服务/DNS 链路。外部 LLM 必须经 egress
# proxy；告警 webhook 必须接入经审批的 notifier，不能靠任意 URL 放行。
networkPolicy:
  egressDefaultDeny: true
  egressCanaryServices: []
  # OrbStack's Kubernetes API endpoint for the current production cluster.
  # Other clusters must replace this with their API-server CIDR before release.
  kubernetesApiCIDRs:
    - 192.168.139.2/32

# 密钥：正式环境必须显式注入强随机值（勿用 CHANGE_ME / 弱默认值）。
# 生成建议：
#   jwtSecret:        openssl rand -hex 32
#   llmEncryptionKey: openssl rand -hex 32   （至少 32 字节，用于 AES-256 加密 LLM key）
#   internalToken:    openssl rand -hex 24
#   ingestApiKey:     openssl rand -hex 24
#   clickhousePassword / mysqlRootPassword: openssl rand -hex 16
secrets:
  # Secret Manager/ExternalSecret must materialize this exact Secret before
  # Helm applies workloads.  The chart will not render plaintext credentials
  # when this is set; missing keys then make Pods unready instead of falling
  # back to defaults.
  existingSecretName: "aiops-secrets"
  jwtSecret: "CHANGE_ME"
  llmEncryptionKey: "CHANGE_ME"
  internalToken: "CHANGE_ME"
  ingestApiKey: "CHANGE_ME"
  clickhousePassword: "CHANGE_ME"
  mysqlRootPassword: "CHANGE_ME"
  # Production must inject an explicit strong admin bootstrap secret at deploy
  # time; never inherit the local admin1234 fallback.
  adminInitialPassword: ""
