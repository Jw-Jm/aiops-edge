# =============================================================================
# AIOps 生产标准 overrides
# 用于正式生产环境部署时叠加：helm upgrade --install aiops . -f values-prod.yaml
# 说明：本机(OrbStack)默认 values.yaml 已是"除副本数=1 外按生产标准"。
#       部署到正式环境时，按需覆盖以下项。
#
# 重要：文件内所有 CHANGE_ME 为占位符，部署前必须替换为强随机值；
#       query-api 因缺失 JWT_SECRET / LLM_ENCRYPTION_KEY 会拒绝启动（安全兜底）。
# =============================================================================

# 无状态服务（frontend/query-api）副本数。
# 注意：ingest（挂 RWO WAL PVC）与 ai-orchestrator（挂 RWO 数据 PVC，含 ChromaDB/sqlite/checkpoint）
#       为有状态单写组件，多副本必然因 RWO PVC 冲突 CrashLoopBackOff，当前固定 1 副本
#       （见下方 orchestratorReplicas / ingestReplicas 覆盖项；若需多副本必须先外部化存储）。
# 有状态中间件（mysql/clickhouse）固定用 statefulReplicaCount=1，不受此值影响。
replicaCount: 2

internalTLS:
  enabled: true
  required: true
  secretName: aiops-internal-tls
  # Must be injected by the production certificate/release system.  The
  # chart rejects an empty value when required=true.
  clientSAN: ""

# 有状态单写组件固定 1 副本（RWO PVC 不可多副本；多副本需先外部化存储再调大）。
orchestratorReplicas: 1
ingestReplicas: 1

# 存储类：正式环境指定真实 SC（如云盘/企业 NFS），覆盖默认 ""
clickhouse:
  storageClass: "standard"
victoriaMetrics:
  storageClass: "standard"
victoriaLogs:
  storageClass: "standard"
chromadb:
  storageClass: "standard"
mysql:
  storageClass: "standard"
hugeGraph:
  enabled: true
  storageClass: "standard"

graph:
  # Production uses HugeGraph only after the graph schema/source reconciliation
  # gate; there is no silent legacy_mysql fallback in the release profile.
  backend: hugegraph

# 备份 PVC（backup-pvc，mysql/clickhouse 每日备份落地盘）
backup:
  storageClass: "standard"

# LLM 接真实模型（关闭 mock）
aiOrchestrator:
  llmMock: "false"
  investigationRuntimeEnabled: "0"
  queryApiUrl: "https://query-api.observability.svc.cluster.local:8080/api/v1"

# Production mutation is opt-in only after the broker profiles and RBAC have
# been provisioned. Keep disabled until CREDENTIAL_PROFILES is reviewed.
credentialBroker:
  enabled: false
  token: ""
  profiles: ""

eventCollector:
  # Production uses out-of-band BMC/Redfish collection. In-band /dev/ipmi0
  # access is restricted to the explicit local-validation profile.
  selCollectEnabled: false
  ingestURL: "https://ingest.observability.svc.cluster.local:8080"

investigationWorker:
  enabled: true
  replicas: 2

# 生产 LLM 出站唯一经 egress proxy，Provider key 只注入 proxy Secret。
llmEgressProxy:
  enabled: true

# ── Egress 默认拒绝（生产基线）──────────────────────────────────────────
# 生产所有 Pod 默认禁止出站，仅允许 networkpolicy.yaml 中按角色声明的
# MySQL/观测存储/Kubernetes API/内部服务/DNS 链路。外部 LLM 必须经 egress
# proxy；告警 webhook 必须接入经审批的 notifier，不能靠任意 URL 放行。
networkPolicy:
  egressDefaultDeny: true
  egressCanaryServices: []
  # Inject the cluster-specific Service/API-server CIDRs at release time;
  # leaving this empty intentionally fails Helm rendering (fail-closed).
  kubernetesApiCIDRs: []

# 密钥：正式环境必须显式注入强随机值（勿用 CHANGE_ME / 弱默认值）。
# 生成建议：
#   jwtSecret:        openssl rand -hex 32
#   llmEncryptionKey: openssl rand -hex 32   （至少 32 字节，用于 AES-256 加密 LLM key）
#   internalToken:    openssl rand -hex 24
#   ingestApiKey:     openssl rand -hex 24
#   clickhousePassword / mysqlRootPassword: openssl rand -hex 16
secrets:
  # Secret Manager/ExternalSecret must materialize this exact Secret before
  # Helm applies workloads.  The chart will not render plaintext credentials
  # when this is set; missing keys then make Pods unready instead of falling
  # back to defaults.
  existingSecretName: "aiops-secrets"
  jwtSecret: "CHANGE_ME"
  llmEncryptionKey: "CHANGE_ME"
  internalToken: "CHANGE_ME"
  ingestApiKey: "CHANGE_ME"
  clickhousePassword: "CHANGE_ME"
  mysqlRootPassword: "CHANGE_ME"
  # Production must inject an explicit strong admin bootstrap secret at deploy
  # time; never inherit the local admin1234 fallback.
  adminInitialPassword: ""
